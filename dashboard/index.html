<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-team · dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1c1f24; --muted: #6b7280; --line: #e5e7eb; --accent: #2563eb;
    --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --live: #16a34a; --amber: #eab308; --chip: #eef2ff; --soft: #f1f3f7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #171a21; --ink: #e5e7eb; --muted: #9ca3af; --line: #262b36; --accent: #60a5fa; --chip: #1f2637; --soft: #1b1f28; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 18px; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; }
  .live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: middle; }
  .live.on { background: var(--live); box-shadow: 0 0 0 0 rgba(22,163,74,.6); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(22,163,74,.5);} 70% { box-shadow: 0 0 0 8px rgba(22,163,74,0);} 100% { box-shadow: 0 0 0 0 rgba(22,163,74,0);} }
  main { padding: 16px 20px 80px; max-width: 1400px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 10px; }
  h2 .n { color: var(--ink); background: var(--chip); border-radius: 10px; padding: 0 8px; margin-left: 6px; font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .tile, .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: border-color .15s; }
  .tile:hover, .card:hover { border-color: var(--accent); }
  .tile .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .tile .big { font-size: 20px; font-weight: 700; margin: 4px 0 2px; }
  .tile .sub, .card .sub { color: var(--muted); font-size: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card .id { font-weight: 700; font-size: 15px; word-break: break-all; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--chip); color: var(--ink); white-space: nowrap; }
  .badge.ok { background: rgba(22,163,74,.15); color: var(--ok); } .badge.bad { background: rgba(220,38,38,.15); color: var(--bad); } .badge.warn { background: rgba(217,119,6,.15); color: var(--warn); }
  .metrics { display: flex; gap: 14px; margin: 10px 0 6px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .metrics b { color: var(--ink); font-weight: 600; }
  .active { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--chip); }
  .active .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .active .row + .row { margin-top: 4px; }
  .agents { margin-top: 8px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
  .agents .row { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  .agents .row b { color: var(--ink); font-weight: 600; min-width: 110px; }
  .bar { height: 4px; border-radius: 2px; background: var(--line); flex: 1; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  #decisions { max-width: 1400px; margin: 0 auto; padding: 16px 20px 0; }
  .dec { background: var(--card); border: 1px solid var(--warn); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  .dec .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .dec .cmd { margin: 8px 0; padding: 8px 10px; border-radius: 8px; background: var(--soft); font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow: auto; }
  .dec .q { font-weight: 600; margin: 10px 0 4px; }
  .dec label.o { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; cursor: pointer; }
  .dec label.o .d { color: var(--muted); font-size: 12px; }
  .dec input[type=text] { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  .dec .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .dec button { font: inherit; padding: 5px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); cursor: pointer; }
  .dec button.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dec button:disabled { opacity: .5; cursor: default; }
  .dec .msg { font-size: 12px; color: var(--muted); }
  .dec .msg.err { color: var(--bad); }
  .awaybtn { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--soft); color: var(--muted); cursor: pointer; }
  .awaybtn.on { border-color: var(--warn); color: var(--warn); background: rgba(217,119,6,.12); }
  .dec .ctx { margin: 6px 0; font-size: 12.5px; color: var(--muted); white-space: pre-wrap; max-height: 120px; overflow: auto; }
  .dec .opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .dec textarea { width: 100%; min-height: 60px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  .sesss { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; margin-top: 12px; }
  .sesscard { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .sesscard.asking { border-color: var(--warn); }
  .sesscard .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .sesscard .nm { font-weight: 700; }
  .sesscard .sub { color: var(--muted); font-size: 12px; }
  .askbox { margin: 8px 0; padding: 8px 10px; border-radius: 8px; background: rgba(217,119,6,.12); }
  .askbox .q { font-weight: 600; }
  .askbox .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .askbox .opt { font-size: 12px; padding: 2px 9px; border-radius: 12px; border: 1px dashed var(--warn); cursor: default; }
  .plan { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; }
  .plan li { display: flex; gap: 8px; padding: 2px 0; color: var(--muted); }
  .plan li .ic { width: 14px; flex: none; text-align: center; }
  .plan li.in_progress { color: var(--ink); font-weight: 600; } .plan li.in_progress .ic { color: var(--live); }
  .plan li.completed .ic { color: var(--ok); }
  .recap { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); padding: 20px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
  /* drawer */
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--card); border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .2s; z-index: 5; overflow: auto; }
  #drawer.open { transform: none; box-shadow: -8px 0 30px rgba(0,0,0,.15); }
  #drawer .head { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 18px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  #drawer .head h3 { margin: 0; font-size: 16px; }
  #drawer .body { padding: 14px 18px; }
  #drawer button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.run { cursor: pointer; } tr.run:hover td { background: var(--chip); }
  tr.detail td { background: var(--bg); color: var(--muted); white-space: pre-wrap; font-size: 12px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .st { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .st.running { background: var(--live); animation: pulse 1.6s infinite; } .st.finished { background: var(--muted); } .st.failed { background: var(--bad); } .st.stale { background: var(--amber); }
  nav.tabs { display: flex; gap: 4px; margin-left: auto; }
  nav.tabs a { color: var(--muted); text-decoration: none; padding: 3px 12px; border-radius: 6px; font-size: 13px; }
  nav.tabs a.cur { background: var(--chip); color: var(--ink); font-weight: 600; }
  .wait { margin-top: 8px; padding: 6px 10px; border-radius: 8px; border: 1px dashed var(--line); font-size: 12.5px; }
  .wait b { font-weight: 600; } .wait.undef b { color: var(--muted); }
  .wait .rule { color: var(--muted); font-size: 11.5px; display: block; margin-top: 2px; }
  .secs { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .secs .row { display: flex; gap: 8px; align-items: center; } .secs .row span:first-child { min-width: 78px; }
  .secs .bar i { background: var(--ok); }
  .mini { width: 100%; margin-top: 8px; font-size: 12px; } .mini td, .mini th { padding: 2px 4px; }
  details.older > summary { cursor: pointer; color: var(--muted); font-size: 13px; margin: 12px 0 8px; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
  .files a { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--chip); color: var(--accent); text-decoration: none; }
  .card.slim { padding: 8px 12px; }
  .flow { color: var(--muted); white-space: nowrap; }
  .flow b { color: var(--ink); font-weight: 600; }
  .note { color: var(--muted); font-size: 12px; margin-top: 10px; }

  /* change flow (drawer) */
  .now { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); margin-bottom: 4px; }
  .now + .now { margin-top: 6px; }
  .now .txt { flex: 1; min-width: 0; } .now .txt b { font-weight: 600; }
  .now .sub { color: var(--muted); font-size: 12.5px; }
  .now .next { font-size: 12.5px; color: var(--muted); text-align: right; white-space: nowrap; }
  .now .rule { color: var(--muted); font-size: 11.5px; }
  .av { position: relative; width: 26px; height: 26px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 10px; display: inline-flex; align-items: center; justify-content: center; flex: none; border: 2px solid var(--card); cursor: pointer; user-select: none; }
  .av.lg { width: 42px; height: 42px; font-size: 14px; cursor: default; }
  .av i { position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--card); background: #9ca3af; }
  .av.lg i { width: 13px; height: 13px; }
  .av i.on { background: var(--ok); animation: pulse 1.6s infinite; } .av i.wait { background: var(--warn); } .av i.stale { background: var(--amber); } .av i.failed { background: var(--bad); }
  .src { font-size: 11px; color: var(--muted); } .src.decl { color: var(--ok); } .warnline { color: var(--warn); font-size: 11.5px; display: block; margin-top: 2px; }
  .sess { color: var(--muted); font-size: 11.5px; }
  .av.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .steps { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin-top: 12px; }
  .step { text-align: center; position: relative; padding: 0 3px; }
  .step::before { content: ""; position: absolute; top: 15px; left: -50%; width: 100%; height: 2px; background: var(--line); }
  .step:first-child::before { display: none; }
  .step.s-done::before, .step.s-active::before { background: var(--ok); }
  .step .sdot { position: relative; z-index: 1; width: 32px; height: 32px; margin: 0 auto; border-radius: 50%; border: 2px solid var(--line); background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); font-weight: 600; }
  .step.s-done .sdot { background: var(--ok); border-color: var(--ok); color: #fff; }
  .step.s-active .sdot { border-color: var(--ok); color: var(--ok); box-shadow: 0 0 0 4px rgba(22,163,74,.18); }
  .step.loop .sdot { border-style: dashed; }
  .step .lbl { font-size: 12.5px; font-weight: 600; margin-top: 6px; } .step.s-pending .lbl { color: var(--muted); font-weight: 500; }
  .step .who { font-size: 11px; color: var(--muted); }
  .step .times { color: var(--accent); font-weight: 700; margin-left: 3px; }
  .step .avs { display: flex; justify-content: center; margin-top: 8px; min-height: 28px; }
  .step .avs .av + .av { margin-left: -8px; }
  .step .meta { font-size: 11px; color: var(--muted); margin-top: 4px; } .step.s-active .meta { color: var(--ok); font-weight: 600; }
  .maestro { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin: 14px 0 2px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .filter { font-size: 12px; color: var(--muted); margin: 6px 0 0; } .filter b { color: var(--ink); } .filter a { color: var(--accent); cursor: pointer; }
  @media (max-width: 720px) {
    .steps { grid-template-columns: 1fr; gap: 10px; }
    .step { display: grid; grid-template-columns: 36px 1fr auto; text-align: left; align-items: center; gap: 8px; }
    .step::before { display: none; }
    .step .sdot { margin: 0; } .step .avs { justify-content: flex-end; margin: 0; } .step .meta { grid-column: 2 / 4; margin: 0; }
    .now { flex-wrap: wrap; } .now .next { text-align: left; white-space: normal; }
  }

  /* conversation (default view of the change drawer) */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  #drawer .seg button { border: 0; border-radius: 0; padding: 3px 10px; font-size: 12.5px; color: var(--muted); }
  #drawer .seg button.cur { background: var(--chip); color: var(--ink); font-weight: 600; }
  .head .tools { display: flex; gap: 8px; align-items: center; }
  .sep { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 4px; }
  .sep::before, .sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .sep.on { color: var(--ok); font-weight: 600; }
  .msg { display: flex; gap: 10px; padding: 8px 8px; border-radius: 8px; border: 1px solid transparent; }
  .msg:hover { background: var(--soft); }
  .msg .av { width: 34px; height: 34px; font-size: 12px; cursor: default; }
  .msg .b { flex: 1; min-width: 0; }
  .msg .h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; font-size: 12.5px; }
  .msg .h b { font-weight: 600; } .msg .h .route { color: var(--muted); font-size: 12px; } .msg .h .route b { color: var(--ink); font-weight: 500; }
  .msg .around { color: var(--muted); font-size: 11px; opacity: .8; }
  .msg .h .t { color: var(--muted); margin-left: auto; font-size: 11.5px; white-space: nowrap; }
  .msg .tag { font-size: 10.5px; padding: 0 6px; border-radius: 8px; background: var(--chip); color: var(--muted); }
  .msg .tag.bad { background: rgba(220,38,38,.15); color: var(--bad); } .msg .tag.warn { background: rgba(217,119,6,.15); color: var(--warn); }
  .msg .c { font-size: 13px; margin-top: 2px; word-break: break-word; }
  .msg .r { font-size: 12px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 8px; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .msg .r .ok, .vok { color: var(--ok); font-weight: 700; } .msg .r .bad, .vbad { color: var(--bad); font-weight: 700; }
  .msg .chips { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 4px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .msg .chips b { color: var(--ink); font-weight: 600; }
  .msg details { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .msg details summary { cursor: pointer; color: var(--accent); list-style: none; } .msg details summary::-webkit-details-marker { display: none; }
  .msg details pre { white-space: pre-wrap; word-break: break-word; font: inherit; background: var(--soft); border-radius: 6px; padding: 6px 8px; margin: 4px 0 0; }
  .msg.on { background: rgba(22,163,74,.08); border-color: rgba(22,163,74,.35); }
  .typing { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
  .typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  .unk { font-size: 12.5px; color: var(--muted); border: 1px dashed var(--warn); border-radius: 8px; padding: 8px 12px; margin-top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .unk .avs { display: flex; } .unk .avs .av + .av { margin-left: -8px; }
  /* presence card */
  #hc { position: fixed; z-index: 10; width: 320px; max-width: calc(100vw - 16px); background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.28); padding: 14px; display: none; font-size: 12.5px; pointer-events: none; }
  #hc .top { display: flex; gap: 10px; align-items: center; }
  #hc .nm { font-weight: 700; font-size: 14px; } #hc .role { color: var(--muted); font-size: 12px; }
  #hc .stt { margin-top: 2px; font-size: 11.5px; font-weight: 600; }
  #hc .row { margin-top: 10px; } #hc .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  #hc .q { background: var(--soft); border-radius: 6px; padding: 6px 8px; margin-top: 3px; max-height: 5.2em; overflow: hidden; word-break: break-word; }
  #hc .kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  #hc .kv b { display: block; font-size: 13px; }
  #overlay { position: fixed; inset: 0; z-index: 4; display: none; } #overlay.open { display: block; }
</style>
</head>
<body>
<header>
  <h1><span class="live" id="live"></span><span id="title">ai-team</span></h1>
  <span class="meta" id="totals"></span>
  <span class="meta" id="updated"></span>
  <nav class="tabs"><a href="./" class="cur">Dashboard</a><a href="team">Team</a><a href="notifications">Notifications</a></nav>
  <button id="away" class="awaybtn" title="With this mode on, when the turn ends with a question from the app, the session waits for your answer here in the dashboard (up to about 5 min)">away from the computer: <b>off</b></button>
</header>
<section id="decisions" hidden></section>
<main id="main"><div class="empty">loading…</div></main>
<div id="overlay"></div>
<div id="hc"></div>
<aside id="drawer"><div class="head"><h3 id="dtitle"></h3><div class="tools"><span class="seg" id="viewseg" hidden><button data-view="chat">conversation</button><button data-view="table">table</button></span><button id="dclose">close</button></div></div><div class="body" id="dbody"></div></aside>

<script type="module">
import { buildFeed, cardData } from './feed.mjs';
const $ = (s, el = document) => el.querySelector(s);
let viewMode = 'chat';
let state = null, drawer = null, liveOk = false, olderOpen = false;
const PALETTE = ['#2563eb','#16a34a','#d97706','#dc2626','#7c3aed','#0891b2','#db2777','#65a30d','#ea580c','#4f46e5'];
const colorOf = (name) => { let h = 0; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtDur(ms) {
  if (!ms || ms < 1000) return '0s';
  const s = Math.round(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60);
  if (h) return `${h}h ${String(m % 60).padStart(2, '0')}min`;
  if (m) return `${m}min ${String(s % 60).padStart(2, '0')}s`;
  return `${s}s`;
}
const TIP_NEW = 'fresh: input + output + cache written (cache creation); does not include cache read';
const TIP_CACHE = 'cache read: tokens read from the prompt cache (cache read), reused on every call; usually much larger than the fresh ones';
const tokCols = (t) => `<td class="num" title="${TIP_NEW}">${fmtTok(t.fresh)}</td><td class="num" title="${TIP_CACHE}">${fmtTok(t.cached)}</td>`;
const tokHeads = `<th class="num" title="${TIP_NEW}">fresh</th><th class="num" title="${TIP_CACHE}">cache read</th>`;
function fmtTok(n) { n = n || 0; return n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + 'k' : String(n); }
function fmtTime(t) {
  if (!t) return '—';
  const d = new Date(t), now = new Date();
  const hm = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  return d.toDateString() === now.toDateString() ? hm : d.toLocaleDateString(undefined, { day: '2-digit', month: '2-digit' }) + ' ' + hm;
}
const changeLabel = (id) => !id ? '—' : id.startsWith('adhoc:') ? `ad-hoc · ${id.slice(6)}` : id;
function fmtDate(t) { return new Date(t).toLocaleDateString(undefined, { day: '2-digit', month: '2-digit', year: '2-digit' }); }
const liveDur = (r) => r.active && r.start ? Date.now() - r.start : r.durationMs;

function render() {
  if (!state) return;
  if (state.error) { $('#main').innerHTML = `<div class="empty">collector error:<br><pre style="text-align:left">${esc(state.error)}</pre></div>`; return; }
  $('#title').textContent = `ai-team · ${state.project.name}`;
  const t = state.totals;
  $('#totals').textContent = `${t.active} in progress of ${t.changes} changes · ${t.runs} runs · ${fmtTok(t.tokenSplit.fresh)} fresh tokens · ${fmtTok(t.tokenSplit.cached)} cache read · ${fmtDur(t.durationMs)} of agents · ${t.teamSessions ?? t.sessions} team sessions${t.sessions > (t.teamSessions ?? t.sessions) ? ` (+${t.sessions - t.teamSessions} loose)` : ''}`;
  $('#updated').textContent = `updated ${fmtTime(state.generatedAt)}`;
  const parts = [];
  // agents now
  parts.push(`<h2>Agents now<span class="n">${state.running.length}</span></h2>`);
  { const n = state.agentStates || {}; parts.push(`<p class="note"><span class="st running"></span>running ${n.running || 0} · <span class="st stale"></span>no signal ${n['no signal'] || 0} (limit ${state.staleMin} min) · <span class="st finished"></span>finished ${n.finished || 0} · <span class="st failed"></span>failed ${n.failed || 0} · interrupted ${n.interrupted || 0} <span class="sub">(all runs read)</span></p>`); }
  parts.push(state.running.length ? agentsTable(state.running, true) : `<div class="empty">no agent running</div>`);
  { const ss = sessionsHtml(state.mainRuns || []); if (ss) parts.push(ss); }
  if (state.recent.length) parts.push(`<details class="older"><summary>finished recently (${state.recent.length}); "finished" does not mean success</summary>${agentsTable(state.recent, false)}</details>`);
  // changes
  const by = Object.fromEntries(state.changes.map((c) => [c.id, c]));
  const pick = (ids) => ids.map((i) => by[i]).filter(Boolean);
  const bd = state.board;
  const groups = [['In progress', pick(bd.running), true], ['Blocked', pick(bd.blocked), false], ['Pending', pick(bd.pending), false]];
  for (const [label, list, always] of groups) {
    if (!list.length && !always) continue;
    parts.push(`<h2>${label}<span class="n">${list.length}</span></h2>`);
    parts.push(list.length ? `<div class="cards">${list.map(cardHtml).join('')}</div>` : `<div class="empty">no change</div>`);
  }
  const doneN = bd.done.length + bd.doneOlder.length;
  parts.push(`<h2>Latest done<span class="n">${doneN}</span></h2>`);
  parts.push(bd.done.length ? `<div class="cards">${pick(bd.done).map(cardHtml).join('')}</div>` : `<div class="empty">no change done</div>`);
  if (bd.doneOlder.length) parts.push(`<details class="older" id="older"${olderOpen ? ' open' : ''}><summary>${bd.doneOlder.length} more done (click to expand)</summary><div class="cards">${pick(bd.doneOlder).map(cardHtml).join('')}</div></details>`);
  const other = pick(bd.other || []).sort((a, b) => (a.kind === 'no-change') - (b.kind === 'no-change') || (b.lastActivity || 0) - (a.lastActivity || 0));
  if (other.length) parts.push(`<h2>Outside changes<span class="n">${other.reduce((n, c) => n + c.rounds, 0)}</span></h2><p class="note">the orchestrator's ad-hoc tasks (prompt "Ad-hoc task: &lt;slug&gt;") and runs that cite no change at all.</p><div class="cards">${other.map(cardHtml).join('')}</div>`);
  const ls = state.looseSessions;
  if (ls && ls.count) parts.push(`<details class="older"><summary>Loose sessions, without the team: ${ls.count}${ls.active ? ` (${ls.active} active)` : ''} · ${fmtDur(ls.durationMs)} · ${fmtTok(ls.tokenSplit.fresh)} fresh · ${fmtTok(ls.tokenSplit.cached)} cache read</summary>
    <p class="note">Sessions that neither called /team nor delegated to a team agent${ls.subagentRuns ? ` (${ls.subagentRuns} plain subagent${ls.subagentRuns === 1 ? '' : 's'} added here)` : ''}. They count neither in the agents' effort nor in the changes.</p>
    <table class="mini"><thead><tr><th>session</th><th>start</th><th>end</th><th class="num">active turns</th></tr></thead><tbody>${ls.recent.map((x) => `<tr><td>${esc(x.name)}${x.live ? ' <span class="badge ok">open</span>' : ''}</td><td>${fmtTime(x.start)}</td><td>${fmtTime(x.end)}</td><td class="num">${fmtDur(x.durationMs)}</td></tr>`).join('')}</tbody></table></details>`);
  parts.push(`<details class="older"><summary>Effort per agent (total tokens and runs)</summary><div class="tiles">` + state.agents.map((a) => `
    <div class="tile" data-agent="${esc(a.agent)}"><div class="name"><span class="dot" style="background:${colorOf(a.agent)}"></span>${esc(a.agent)}</div>
      <div class="big" title="${TIP_NEW}">${fmtTok(a.tokenSplit.fresh)} <span class="sub">fresh</span></div><div class="sub" title="${TIP_CACHE}">${fmtTok(a.tokenSplit.cached)} cache read</div><div class="sub">${a.runs} run(s) · ${fmtDur(a.durationMs)}</div></div>`).join('') + `</div></details>`);
  if (state.unlinked.length) parts.push(`<p class="note">${state.unlinked.length} subagent run(s) without a visible call in the main session (session compacted or truncated); shown with the agent from the transcript.</p>`);
  $('#main').innerHTML = parts.join('');
  if (drawer) openDrawer(drawer.kind, drawer.id, true);
}

// open team sessions: step list (update_plan / TodoWrite) and pending question (wrap_up / AskUserQuestion)
const PLAN_IC = { completed: '✓', in_progress: '●', pending: '○' };
// the card options only show the question; answering through the dashboard only works while the hook waits (card in "Decisions")
function askHint(r, a) {
  const away = !!(state.away && state.away.on);
  const live = ((state && state.pending) || []).some((p) => p.sessionId === r.sessionId && (p.kind === 'question' || p.kind === 'reply'));
  if (live) return '<a href="#decisions">answer in "Decisions waiting for you", at the top</a>, or in the session';
  if (a.kind === 'wrap_up' && !away) return 'answer in the session (or turn on "away from the computer" to answer here next time)';
  return `the dashboard is no longer waiting for this answer (the time ran out or the hook is missing): answer in the session${away ? '' : '. With "away from the computer" on, the dashboard waits longer'}`;
}
function sessionsHtml(list) {
  const open = list.filter((r) => r.active && (r.plan || r.ask)).sort((a, b) => !!b.ask - !!a.ask || (b.end || 0) - (a.end || 0));
  if (!open.length) return '';
  const card = (r) => {
    const a = r.ask;
    const askBox = a ? a.questions.map((q) => `<div class="askbox"><div class="q">${esc(q.question)}</div>${q.options.length ? `<div class="opts">${q.options.map((o) => `<span class="opt" title="${esc(o.description)}">${esc(o.label)}</span>`).join('')}</div>` : ''}</div>`).join('')
      + `<div class="sub">${a.kind === 'question' ? 'question with options' : 'end-of-turn question'} since ${fmtTime(a.ts)} · ${askHint(r, a)}</div>` : '';
    const p = r.plan;
    const plan = p ? `<ul class="plan">${p.items.map((x) => `<li class="${x.status}"><span class="ic">${PLAN_IC[x.status]}</span><span>${esc(x.content)}</span></li>`).join('')}</ul>` : '';
    const recap = !a && r.recap && (!p || r.recap.ts >= p.ts) ? `<div class="recap">${esc(r.recap.text)}</div>` : '';
    return `<div class="sesscard${a ? ' asking' : ''}"><div class="top"><span class="nm" title="${esc(r.sessionId)}">${esc(r.sessionName || r.sessionId.slice(0, 8))}</span>
      <span class="sub">${p ? `${p.done}/${p.total} steps · ` : ''}${r.live ? '<span class="badge ok">open</span>' : esc(r.status)}</span></div>${askBox}${plan}${recap}</div>`;
  };
  return `<div class="sesss">${open.map(card).join('')}</div>`;
}

function agentsTable(list, live) {
  return `<table><thead><tr><th>agent</th><th>change</th><th>stage</th><th>session</th><th>since</th><th>${live ? 'last activity' : 'finished'}</th>${tokHeads}<th>model</th><th>what</th></tr></thead><tbody>${list.map((r) => `
    <tr><td><span class="st ${stCls(r.status)}" title="${esc(r.status)}"></span>${esc(r.agent)}${r.main ? ' <span class="sub">(main session)</span>' : ''}${silentTxt(r)}</td>
      <td>${esc(changeLabel(r.change))}</td><td>${r.stage ? esc(r.stage) : r.main && r.plan && r.plan.current ? `${esc(r.plan.current)} <span class="sub">(${r.plan.done}/${r.plan.total})</span>` : '<span class="sub" title="could not infer it from the prompt">—</span>'}${r.main && r.ask ? ' <span class="badge warn">question for you</span>' : ''}</td>
      <td class="sess" title="${esc(r.sessionId || '')}">${esc(r.sessionName || '—')}</td>
      <td>${fmtTime(r.since)}${live ? ` <span class="sub">(<span data-since="${r.since}">${fmtDur(Date.now() - r.since)}</span> ago)</span>` : ''}</td>
      <td>${live ? `${fmtTime(r.lastActivity)}` : `${fmtTime(r.end)} <span class="sub">${esc(r.status)}</span>`}</td>
      ${tokCols(r.tokenSplit)}<td>${esc(r.model || '?')}</td><td>${esc(r.description || '')}</td></tr>`).join('')}</tbody></table>`;
}

const stCls = (st) => (st === 'no signal' || st === 'interrupted' ? 'stale' : esc(st));
const sessLine = (r) => (r && r.sessionName ? `<div class="sess" title="${esc(r.sessionId || '')}">session: ${esc(r.sessionName)}</div>` : '');
const silentTxt = (r) => (r.status === 'no signal' ? ` <span class="sub" title="no activity in the transcript and no recorded end (limit: ${state.staleMin} min)">no signal for ${fmtDur(r.silentMs || 0)}</span>` : '');
// "waiting for <who> for X" + note + source (declared or inferred, with the rule)
function waitHtml(w, extra = '') {
  if (!w) return '';
  const decl = w.source === 'declared';
  const since = decl && w.since ? ` <span class="sub">for <span data-since="${w.since}">${fmtDur(Date.now() - w.since)}</span></span>` : '';
  const note = decl && w.note ? `<span class="rule">${esc(w.note)}</span>` : '';
  const src = decl ? `<span class="src decl">declared: ${esc(w.rule)}</span>` : `<span class="src">inferred: ${esc(w.rule)}</span>`;
  return `<div class="wait${w.text === 'undefined' ? ' undef' : ''}"><b>${esc(w.text)}</b>${since}${note}<span class="rule">${src}</span>${w.warning ? `<span class="warnline">${esc(w.warning)}</span>` : ''}${extra}</div>`;
}
function cardHtml(c) {
  const b = [];
  if (c.tasks.total) b.push(`<span class="badge">tasks ${c.tasks.done}/${c.tasks.total}</span>`);
  if (c.tasks.blocked) b.push(`<span class="badge bad">${c.tasks.blocked} blocked</span>`);
  if (c.kind === 'adhoc') {   // no change: review and validation come back in the agents' replies, not in a file
    b.push(`<span class="badge">ad-hoc task</span>`);
    if (c.activeAgents.length) b.push(`<span class="badge ok">running: ${esc(c.activeAgents.map((a) => a.agent).join(', '))}</span>`);
  } else if (c.kind !== 'no-change') {
    b.push(c.review ? `<span class="badge ${/APPROVED/.test(c.review) && !/NOT APPROVED|CHANGES/.test(c.review) ? 'ok' : 'warn'}">review: ${esc(c.review)}</span>` : `<span class="badge">no review</span>`);
    b.push(c.validation ? `<span class="badge ${/APPROVED/.test(c.validation) && !/NOT APPROVED/.test(c.validation) ? 'ok' : 'bad'}">Validation: ${esc(c.validation)}</span>` : `<span class="badge">no validation</span>`);
  }
  if (c.archived) b.push(`<span class="badge ok">archived</span>`);
  if (c.unknown) b.push(`<span class="badge warn">no folder in openspec/</span>`);
  const secs = Object.entries(c.sections).filter(([, v]) => v.total).map(([k, v]) => `<div class="row"><span>${esc(k.replace(/\s*\(.*$/, ''))}</span><div class="bar"><i style="width:${Math.round(100 * v.done / v.total)}%"></i></div><span>${v.done}/${v.total}</span></div>`).join('');
  const w = c.waiting;
  const wait = waitHtml(w);
  const ag = c.agents.length ? `<table class="mini"><thead><tr><th>agent</th>${tokHeads}<th class="num">runs</th></tr></thead><tbody>${c.agents.map((a) => `<tr><td><span class="dot" style="background:${colorOf(a.agent)};width:8px;height:8px;margin-right:6px"></span>${esc(a.agent)}</td>${tokCols(a.tokenSplit)}<td class="num">${a.runs}</td></tr>`).join('')}</tbody></table>` : '';
  return `<div class="card" data-change="${esc(c.id)}">
    <div class="top"><div class="id">${esc(c.title || c.id)}</div><div class="sub" title="start: ${esc(c.startSource || 'unknown')}">${c.startedAt ? 'started ' + fmtDate(c.startedAt) : ''}</div></div>
    <div class="badges">${b.join('')}</div>
    <div class="metrics"><span title="${TIP_NEW}"><b>${fmtTok(c.tokenSplit.fresh)}</b> fresh</span><span title="${TIP_CACHE}"><b>${fmtTok(c.tokenSplit.cached)}</b> cache read</span><span><b>${c.rounds}</b> runs</span><span>activity ${c.lastActivity ? fmtTime(c.lastActivity) : '—'}</span></div>
    ${secs ? `<div class="secs">${secs}</div>` : ''}${wait}${ag}
  </div>`;
}

function runsTable(runs, showChange) {
  if (!runs.length) return '<p class="note">no runs.</p>';
  return `<table><thead><tr><th>agent</th>${showChange ? '<th>change</th>' : ''}<th>from → to</th><th>start</th><th>end</th><th class="num">duration</th>${tokHeads}<th>model</th><th>what</th></tr></thead><tbody>${runs.map((r, i) => `
    <tr class="run" data-i="${i}"><td><span class="st ${stCls(r.status)}" title="${esc(r.status)}"></span>${esc(r.agent)}${r.background ? ' <span class="sub" title="background">bg</span>' : ''}${silentTxt(r)}</td>
      ${showChange ? `<td>${esc(changeLabel(r.change))}</td>` : ''}
      <td class="flow"><b>${esc(r.from || '?')}</b> → <b>${r.to ? esc(r.to) : (r.active ? '…' : '?')}</b></td>
      <td>${fmtTime(r.start)}</td><td>${r.active ? '<em>running</em>' : fmtTime(r.end)}</td>
      <td class="num" data-run-start="${r.active ? r.start : ''}">${fmtDur(liveDur(r))}</td>
      <td class="num" title="${TIP_NEW} (input ${fmtTok(r.usage.input)} · output ${fmtTok(r.usage.output)} · cache written ${fmtTok(r.usage.cacheCreation)}) · ${r.usage.requests} calls · ${r.toolUses} tools">${fmtTok(r.tokenSplit.fresh)}</td><td class="num" title="${TIP_CACHE}">${fmtTok(r.tokenSplit.cached)}</td>
      <td>${esc(r.model || '?')}</td><td>${esc(r.description || '')}${sessLine(r)}</td></tr>
    <tr class="detail" hidden><td colspan="${showChange ? 10 : 9}">${esc(r.summary ? 'reply: ' + r.summary : '')}${r.summary && r.promptPreview ? '\n\n' : ''}${esc(r.promptPreview ? 'prompt: ' + r.promptPreview : '')}${r.totalTokensReported != null ? `\n\ntokens reported by the Agent tool: ${fmtTok(r.totalTokensReported)}` : ''}</td></tr>`).join('')}</tbody></table>`;
}


// ---- conversation: feed messages (the assembly logic is in /feed.mjs) ----
function chatHtml(items, showChange) {
  if (!items.length) return '<p class="note">no runs.</p>';
  return items.map((m) => {
    if (m.type === 'sep') return `<div class="sep${m.active ? ' on' : ''}">${esc(m.label)}${m.active ? ' · now' : ''}</div>`;
    const u = m.usage;
    const tip = `${TIP_NEW} (input ${fmtTok(u.input)} · output ${fmtTok(u.output)} · cache written ${fmtTok(u.cacheCreation)}) · ${u.requests} calls`;
    const stTag = m.status === 'failed' ? '<span class="tag bad">failed</span>' : m.status === 'no signal' ? `<span class="tag warn" title="no activity in the transcript and no recorded end">no signal for ${fmtDur(m.silentMs)}</span>` : m.status === 'interrupted' ? '<span class="tag warn">interrupted</span>' : '';
    const route = `called by <b>${esc(m.route.by)}</b>`;
    const around = m.route.around ? `<div class="around">${esc(m.route.around)}</div>` : '';
    const when = m.active ? `${fmtTime(m.start)} → <em>running</em>` : `${fmtTime(m.start)} → ${fmtTime(m.end)}`;
    const quote = m.summary ? `<div class="r">${m.summaryParts.map((p) => p.cls ? `<span class="${p.cls}">${esc(p.text)}</span>` : esc(p.text)).join('')}</div>` : '';
    const det = [m.promptPreview ? 'prompt: ' + m.promptPreview : '', m.totalTokensReported != null ? 'tokens reported by the Agent tool: ' + fmtTok(m.totalTokensReported) : ''].filter(Boolean).join('\n\n');
    return `<div class="msg${m.active ? ' on' : ''}" data-hc="${esc(m.agent)}">${avatar(m.agent, m.presence, { filter: false })}<div class="b">
      <div class="h"><b>${esc(m.agent)}</b>${m.background ? '<span class="tag" title="background">bg</span>' : ''}${stTag}${showChange ? `<span class="tag">${esc(m.change || '—')}</span>` : ''}<span class="route">${route}</span><span class="t">${when}</span></div>
      ${around}${m.sessionName ? `<div class="sess">session: ${esc(m.sessionName)}</div>` : ''}
      <div class="c">${esc(m.description || '(no description)')}${m.active ? '<span class="typing" title="working"><i></i><i></i><i></i></span>' : ''}</div>
      ${quote}
      <div class="chips"><span>${esc(m.model)}</span><span class="num"${m.active ? ` data-run-start="${m.start}"` : ''}>${fmtDur(m.active ? Date.now() - m.start : m.durationMs)}</span><span title="${tip}"><b>${fmtTok(m.fresh)}</b> fresh</span><span title="${TIP_CACHE}"><b>${fmtTok(m.cached)}</b> cache read</span><span><b>${m.toolUses}</b> tool${m.toolUses === 1 ? '' : 's'}</span></div>
      ${det ? `<details><summary>show prompt</summary><pre>${esc(det)}</pre></details>` : ''}</div></div>`;
  }).join('');
}

// ---- presence card (hover over an avatar or a message) ----
const hc = $('#hc');
function hcHtml(name) {
  const c = drawer && drawer.kind === 'change' ? state.changes.find((x) => x.id === drawer.id) : null;
  if (!c) return '';
  const main = state.project.mainAgent;
  const d = cardData(c, name, { mainAgent: main, mainLive: state.mainRuns.some((r) => r.agent === main && r.active && r.live) });
  const col = { on: 'var(--ok)', wait: 'var(--warn)', stale: 'var(--amber)', failed: 'var(--bad)' }[d.presence] || 'var(--muted)';
  let st = d.presence === 'on' ? `● working${d.since ? ` for <span data-since="${d.since}">${fmtDur(Date.now() - d.since)}</span>` : ''}` : d.presence === 'wait' ? 'queued' : d.presence === 'stale' ? 'no signal or interrupted' : d.presence === 'failed' ? 'failed' : (d.endAt ? `finished at ${fmtTime(d.endAt)}` : 'no runs in this change');
  if (d.verdictText) st += ` · <span class="${d.verdict === 'ok' ? 'vok' : 'vbad'}">${esc(d.verdictText)}</span>`;
  const cut = (t) => esc(t.length > 220 ? t.slice(0, 220) + '…' : t);
  const trunc = d.isMain ? '—' : null;
  return `<div class="top">${avatar(name, d.presence, { large: true, filter: false }).replace(/ data-hc="[^"]*"/, '')}<div><div class="nm">${esc(name)}</div><div class="role">${esc(d.role)}${d.model ? ' · ' + esc(d.model) : ''}</div><div class="stt" style="color:${col}">${st}</div></div></div>
    ${d.route ? `<div class="row"><div class="k">called by</div><div class="q">${esc(d.route.by)}${d.route.around ? `<br><span class="sub">${esc(d.route.around)}</span>` : ''}</div></div>` : ''}
    ${d.what ? `<div class="row"><div class="k">what</div><div class="q">${cut(d.what)}</div></div>` : ''}
    ${d.lastReturn ? `<div class="row"><div class="k">last reply</div><div class="q">${cut(d.lastReturn)}</div></div>` : ''}
    <div class="kv"><div><span class="k">${d.isMain ? 'delegations' : 'runs'}</span><b>${d.rounds}</b></div><div><span class="k">fresh</span><b>${trunc || fmtTok(d.fresh)}</b></div><div><span class="k">cache read</span><b>${trunc || fmtTok(d.cached)}</b></div></div>`;
}
function hideHc() { hc.style.display = 'none'; hc.dataset.for = ''; }
document.addEventListener('mouseover', (e) => {
  const el = e.target.closest ? e.target.closest('[data-hc]') : null;
  if (!el || !drawer || drawer.kind !== 'change') return hideHc();
  const key = el.dataset.hc;
  if (hc.dataset.for !== key || hc.style.display === 'none') {
    const html = hcHtml(key); if (!html) return hideHc();
    hc.innerHTML = html; hc.dataset.for = key;
  }
  hc.style.display = 'block';
  const r = el.getBoundingClientRect(), w = hc.offsetWidth, h = hc.offsetHeight;
  const x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
  let y = r.bottom + 8; if (y + h > innerHeight - 8) y = r.top - h - 8;
  hc.style.left = x + 'px'; hc.style.top = Math.min(Math.max(8, y), Math.max(8, innerHeight - h - 8)) + 'px';
});
document.addEventListener('mouseout', (e) => { if (!e.relatedTarget) hideHc(); });
document.addEventListener('scroll', hideHc, true);

// ---- change flow: "Now" strip + stage trail ----
const FLOW_VERB = { spec: 'drafting the proposal', build: 'implementing', review: 'reviewing', fix: 'fixing', validation: 'validating', integration: 'integrating' };
const initials = (n) => { if (n === 'you') return 'ME'; const p = String(n).split(/[-_ ]+/).filter(Boolean); return (p.length > 1 ? p[0][0] + p[1][0] : String(n).slice(0, 2)).toUpperCase(); };
const colorFor = (n) => (n === 'you' ? 'var(--warn)' : colorOf(n));
const taskLabel = (r) => (r.task ? `task ${r.task}${r.taskSection ? ` (${r.taskSection})` : ''}` : r.taskSection ? `section ${r.taskSection}` : '');
function avatar(name, st, { sel = false, large = false, filter = true } = {}) {
  const pres = ['on', 'wait', 'stale', 'failed'].includes(st) ? st : '';
  return `<span class="av${large ? ' lg' : ''}${sel ? ' sel' : ''}" style="background:${colorFor(name)}${st === 'wait' ? ';opacity:.6' : ''}" data-hc="${esc(name)}" ${filter ? `data-filter="${esc(name)}"` : ''}>${initials(name)}<i class="${pres}"></i></span>`;
}
function nowStrip(c) {
  const t = c.trail, act = c.runs.filter((r) => r.active);
  const stale = c.runs.filter((r) => r.status === 'no signal' && r.delegated && r.silentMs < 24 * 3600 * 1000);
  const nx = t ? `<div class="next">${t.next ? `next: <b>${esc(t.next.label)}</b>` : ''}${t.after ? `<br>then: ${esc(t.after.label.toLowerCase())}` : ''}</div>` : '';
  const staleRows = stale.slice(0, 3).map((r) => `<div class="now">${avatar(r.agent, 'stale', { large: true, filter: false })}<div class="txt">
      <div><b>${esc(r.agent)}</b> no signal for <span data-silent="${Date.now() - r.silentMs}">${fmtDur(r.silentMs)}</span></div>
      <div class="sub">last activity ${fmtTime(Date.now() - r.silentMs)} · started ${fmtTime(r.start)} · ${esc(r.model || '?')} · called by ${esc(r.from || '?')}</div>${sessLine(r)}</div></div>`).join('');
  if (!act.length) {
    return `<div class="now"><div class="txt"><div>No agent running now.</div>${waitHtml(c.waiting)}</div>${nx}</div>${staleRows}`;
  }
  return act.slice(0, 3).map((r, i) => {
    const verb = FLOW_VERB[r.flow] || 'working';
    const tk = taskLabel(r);
    return `<div class="now">${avatar(r.agent, 'on', { large: true, filter: false })}<div class="txt">
      <div><b>${esc(r.agent)}</b> is ${verb}${tk ? ` <b>${esc(tk)}</b>` : ''}</div>
      <div class="sub">for <span data-since="${r.start}">${fmtDur(Date.now() - r.start)}</span> · ${esc(r.model || '?')} · ${fmtTok(r.tokenSplit.fresh)} fresh tokens · called by ${esc(r.from || '?')}</div>${sessLine(r)}</div>${i === 0 ? nx : ''}</div>`;
  }).join('') + (act.length > 3 ? `<p class="note">+${act.length - 3} agents running.</p>` : '') + staleRows;
}
function stepMeta(s) {
  if (s.state === 'active') return s.active ? '● now' : s.key === 'approval' ? '● waiting for you' : s.key === 'integration' ? '● left to integrate' : '● in progress';
  if (s.key === 'approval') return s.state === 'done' ? 'approved' : '—';
  if (s.result && s.state === 'done') return esc(s.result);
  if (s.state === 'done') return s.rounds ? `${s.rounds} run${s.rounds > 1 ? 's' : ''}` : 'done';
  return s.queued ? 'queued' : '—';
}
function trailHtml(c, filter, mainAgent, mainLive) {
  const t = c.trail; if (!t) return '';
  if (t.unknown) {
    const names = [...new Set(c.runs.map((r) => r.agent))];
    return `<div class="unk"><span>no folder in <b>openspec/</b>: unknown stage</span>${names.length ? `<span class="avs">${names.map((n) => avatar(n, c.runs.some((r) => r.agent === n && r.active) ? 'on' : 'done', { sel: filter === n })).join('')}</span>` : ''}</div>
      <div class="maestro">${avatar(mainAgent, mainLive ? 'on' : 'done', { sel: filter === mainAgent })}<span>${esc(mainAgent)} coordinates the stages: ${t.delegations} delegation${t.delegations === 1 ? '' : 's'} in this change.</span></div>`;
  }
  const steps = t.steps.map((s, i) => {
    const sub = s.key === 'build' && s.tasks && s.tasks.total ? `devs · ${s.tasks.done} of ${s.tasks.total} tasks` : s.who;
    const who = s.key === 'integration' ? mainAgent : sub;
    const avs = s.agents.map((a) => avatar(a.agent, a.agent === mainAgent && a.state === 'wait' && mainLive ? 'on' : a.state, { sel: filter === a.agent })).join('');
    return `<div class="step s-${s.state}${s.loop ? ' loop' : ''}"><div class="sdot">${s.state === 'done' ? '✓' : i + 1}</div>
      <div><div class="lbl">${esc(s.label)}${s.times ? `<span class="times">×${s.times}</span>` : ''}</div><div class="who">${esc(who)}</div></div>
      <div class="avs">${avs}</div><div class="meta">${stepMeta(s)}</div></div>`;
  }).join('');
  const n = t.delegations;
  const srcLine = `<p class="src${t.source === 'declared' ? ' decl' : ''}" style="margin:4px 0 8px">stage ${t.source === 'declared' ? 'declared' : 'inferred'}: ${esc(t.rule || '—')}${t.warning ? `<span class="warnline">${esc(t.warning)}</span>` : ''}</p>`;
  return `${srcLine}<div class="steps">${steps}</div>
    <div class="maestro">${avatar(mainAgent, mainLive ? 'on' : 'done', { sel: filter === mainAgent })}<span>${esc(mainAgent)} coordinates every stage: ${n} delegation${n === 1 ? '' : 's'} in this ${t.loose ? 'ad-hoc task (no proposal nor approval; stages taken from the runs)' : 'change'}. Dashed border: a stage that may repeat (review → fix → review).</span></div>`;
}
function setFilter(who) {
  if (!drawer) return;
  drawer.filter = who && drawer.filter !== who ? who : null;
  openDrawer(drawer.kind, drawer.id, true);
}

function openDrawer(kind, id, keep) {
  const filter = drawer && drawer.kind === kind && drawer.id === id ? drawer.filter || null : null;
  drawer = { kind, id, filter };
  let runs = [], title = '', note = '';
  if (kind === 'change') {
    const c = state.changes.find((x) => x.id === id); if (!c) return closeDrawer();
    runs = c.runs; title = c.title || c.id;
    if (filter) runs = runs.filter((r) => r.agent === filter);
    note = `${c.rounds} runs · ${c.handoffs} agent handoffs · ${fmtDur(c.durationMs)} · ${fmtTok(c.tokenSplit.fresh)} fresh tokens, ${fmtTok(c.tokenSplit.cached)} cache read. One run = one delegation from ${esc(state.project.mainAgent)} to an agent; every agent returns to ${esc(state.project.mainAgent)}; "from → to" (table) and "before / after" (conversation) only show who worked before and after on the same change.`;
  } else {
    runs = state.changes.flatMap((c) => c.runs.filter((r) => r.agent === id)).sort((a, b) => a.start - b.start);
    const main = state.mainRuns.filter((r) => r.agent === id);
    title = id;
    const a = state.agents.find((x) => x.agent === id);
    note = a ? `${a.runs} runs · ${fmtDur(a.durationMs)} · ${fmtTok(a.tokenSplit.fresh)} fresh tokens (input ${fmtTok(a.input)}, output ${fmtTok(a.output)}, cache written ${fmtTok(a.cacheCreation)}), ${fmtTok(a.tokenSplit.cached)} cache read · models: ${esc(a.models.join(', ') || '?')}` : '';
    if (main.length) note += `<br>As the main session agent: ${main.length} session(s), ${fmtDur(main.reduce((s, r) => s + r.durationMs, 0))} of active turns, ${fmtTok(main.reduce((s, r) => s + r.usage.input + r.usage.output + r.usage.cacheCreation, 0))} fresh, ${fmtTok(main.reduce((s, r) => s + r.usage.cacheRead, 0))} cache read (not counted in the changes).`;
  }
  $('#dtitle').textContent = title;
  let files = '';
  if (kind === 'change') {
    const c = state.changes.find((x) => x.id === id);
    files = c.files && c.files.length ? `<div class="files">${c.files.map((f) => `<a href="changes/${encodeURIComponent(id)}/${f.split('/').map(encodeURIComponent).join('/')}" target="_blank" rel="noopener">${esc(f)}</a>`).join('')}</div>` : `<p class="note">${c.kind === 'adhoc' ? 'ad-hoc task: no files; review and validation come back in the reply of each run.' : 'no .md files.'}</p>`;
  }
  let flow = '';
  if (kind === 'change') {
    const c = state.changes.find((x) => x.id === id);
    const main = state.project.mainAgent;
    const mainLive = state.mainRuns.some((r) => r.agent === main && r.active && r.live);
    flow = nowStrip(c) + trailHtml(c, filter, main, mainLive)
      + (filter ? `<p class="filter">showing only <b>${esc(filter)}</b> (${runs.length} run${runs.length === 1 ? '' : 's'}) · <a data-filter-clear>show all</a></p>` : '');
  }
  const useChat = kind === 'change' && viewMode === 'chat';
  const body = useChat ? chatHtml(buildFeed(state.changes.find((x) => x.id === id).runs, { filter, mainAgent: state.project.mainAgent }), false) : runsTable(runs, kind === 'agent');
  $('#viewseg').hidden = kind !== 'change';
  $('#viewseg').querySelectorAll('button').forEach((b) => b.classList.toggle('cur', b.dataset.view === viewMode));
  $('#dbody').innerHTML = `${files}${flow}<p class="note">${note}</p>${body}`;
  hideHc();
  $('#dbody').querySelectorAll('[data-filter]').forEach((el) => el.addEventListener('click', () => setFilter(el.dataset.filter)));
  const clr = $('#dbody [data-filter-clear]'); if (clr) clr.addEventListener('click', () => setFilter(null));
  $('#dbody').querySelectorAll('tr.run').forEach((tr) => tr.addEventListener('click', () => { const d = tr.nextElementSibling; d.hidden = !d.hidden; }));
  if (!keep) { $('#drawer').classList.add('open'); $('#overlay').classList.add('open'); }
}
function closeDrawer() { hideHc(); drawer = null; $('#drawer').classList.remove('open'); $('#overlay').classList.remove('open'); }

document.addEventListener('toggle', (e) => { if (e.target.id === 'older') olderOpen = e.target.open; }, true);
document.addEventListener('click', (e) => {
  if (e.target.closest('a')) return;
  const card = e.target.closest('[data-change]'); if (card) return openDrawer('change', card.dataset.change);
  const tile = e.target.closest('[data-agent]'); if (tile) return openDrawer('agent', tile.dataset.agent);
});
$('#viewseg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b || !drawer) return; viewMode = b.dataset.view; openDrawer(drawer.kind, drawer.id, true); });
$('#dclose').addEventListener('click', closeDrawer);
$('#overlay').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

// ---- pending decisions (ask.mjs): redraws only when the list changes, so typed text is not lost
let decKey = '';
const sessName = (id) => { const r = state && (state.mainRuns || []).find((x) => x.sessionId === id); return r ? r.sessionName : id ? id.slice(0, 8) : '?'; };
function decisionHtml(p) {
  const head = `<div class="top"><span><b>${p.kind === 'reply' ? 'End of turn: question for you' : p.kind === 'question' ? 'Question' : `Permission: ${esc(p.tool)}`}</b> <span class="sub">${p.agentType ? `${esc(p.agentType)} · ` : ''}session: ${esc(sessName(p.sessionId))}</span></span>
    <span class="sub">since ${fmtTime(p.ts)} (<span data-since="${p.ts}">${fmtDur(Date.now() - p.ts)}</span> ago)</span></div>`;
  if (p.kind === 'reply') {   // end of turn in away mode: the answer goes back to the session as your message
    const q = p.questions[0];
    return `<div class="dec" data-dec="${esc(p.id)}">${head}${p.summary ? `<details><summary class="sub">last reply of the session</summary><div class="ctx">${esc(p.summary)}</div></details>` : ''}
      <div class="q">${esc(q.question)}</div><div class="opts">${q.options.map((o, i) => `<button data-act="opt" data-i="${i}" title="${esc(o.description || o.label)}">${esc(o.label)}</button>`).join('')}</div>
      <textarea name="reply" placeholder="or write the answer"></textarea>
      <div class="acts"><button class="pri" data-act="reply">Send answer</button><button data-act="app">Leave it to the app</button><span class="msg"></span></div></div>`;
  }
  if (p.kind === 'question') {
    const qs = p.questions.map((q, i) => `<div class="q">${esc(q.question)}</div>${q.options.map((o) => `<label class="o"><input type="${q.multiSelect ? 'checkbox' : 'radio'}" name="q${i}" value="${esc(o.label)}"><span>${esc(o.label)}${o.description ? `<div class="d">${esc(o.description)}</div>` : ''}</span></label>`).join('')}
      <label class="o"><input type="${q.multiSelect ? 'checkbox' : 'radio'}" name="q${i}" value="__other"><span>Other</span></label><input type="text" name="t${i}" placeholder="free answer (selects Other)">`).join('');
    return `<div class="dec" data-dec="${esc(p.id)}">${head}${qs}<div class="acts"><button class="pri" data-act="send">Send answer</button><button data-act="skip">Decline</button><span class="msg"></span></div></div>`;
  }
  return `<div class="dec" data-dec="${esc(p.id)}">${head}<div class="cmd">${esc(p.summary)}</div>${p.detail ? `<div class="sub">${esc(p.detail)}</div>` : ''}
    <div class="acts"><button class="pri" data-act="allow">Allow once</button><button data-act="deny">Deny</button><input type="text" name="why" placeholder="reason (optional, goes to Claude)" style="flex:1;min-width:180px"><span class="msg"></span></div></div>`;
}
function renderDecisions() {
  const list = (state && state.pending) || [];
  const key = list.map((p) => p.id).join(',');
  const box = $('#decisions');
  if (key === decKey) return;
  decKey = key;
  box.hidden = !list.length;
  if (!list.length) { box.innerHTML = ''; return; }
  if (!$('#declist', box)) box.innerHTML = `<h2>Decisions waiting for you<span class="n"></span></h2><p class="note">Answer here or in the app: the first answer wins. With no answer, the hook gives up after a few minutes and only the app asks.</p><div id="declist"></div>`;
  $('h2 .n', box).textContent = list.length;
  // card by card: the ones that stay are left as they are (with what was already typed)
  const wrap = $('#declist', box), ids = new Set(list.map((p) => p.id));
  wrap.querySelectorAll('.dec').forEach((el) => { if (!ids.has(el.dataset.dec)) el.remove(); });
  for (const p of list) if (!wrap.querySelector(`.dec[data-dec="${p.id}"]`)) wrap.insertAdjacentHTML('beforeend', decisionHtml(p));
}
$('#decisions').addEventListener('input', (e) => {   // typing in "Other" selects the option
  const m = /^t(\d+)$/.exec(e.target.name || ''); if (!m) return;
  const other = e.target.closest('.dec').querySelector(`input[name="q${m[1]}"][value="__other"]`); if (other && e.target.value) other.checked = true;
});
$('#decisions').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const card = b.closest('.dec'), id = card.dataset.dec, p = ((state && state.pending) || []).find((x) => x.id === id);
  const msg = card.querySelector('.msg'); if (!p) return;
  const body = { id };
  if (b.dataset.act === 'opt') { const o = p.questions[0].options[Number(b.dataset.i)]; body.behavior = 'allow'; body.reply = o.description || o.label; }
  else if (b.dataset.act === 'reply') { body.behavior = 'allow'; body.reply = card.querySelector('textarea[name=reply]').value.trim(); if (!body.reply) { msg.textContent = 'write the answer or click an option'; msg.className = 'msg err'; return; } }
  else if (b.dataset.act === 'app') body.behavior = 'deny';
  else if (b.dataset.act === 'allow') body.behavior = 'allow';
  else if (b.dataset.act === 'deny') { body.behavior = 'deny'; const w = card.querySelector('input[name=why]').value.trim(); if (w) body.message = w; }
  else if (b.dataset.act === 'skip') { body.behavior = 'deny'; body.message = 'The user declined to answer through the dashboard.'; }
  else {
    body.behavior = 'allow'; body.answers = {};
    for (const [i, q] of p.questions.entries()) {
      const vals = [...card.querySelectorAll(`input[name="q${i}"]:checked`)].map((x) => x.value === '__other' ? card.querySelector(`input[name="t${i}"]`).value.trim() : x.value).filter(Boolean);
      if (!vals.length) { msg.textContent = `answer: ${q.question}`; msg.className = 'msg err'; return; }
      body.answers[q.question] = q.multiSelect ? vals : vals[0];
    }
  }
  card.querySelectorAll('button').forEach((x) => { x.disabled = true; });
  msg.className = 'msg'; msg.textContent = 'sending…';
  try {
    const r = await fetch('api/answer', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const o = await r.json();
    if (!r.ok) throw new Error(o.error || r.status);
    msg.textContent = 'sent; the session goes on in a moment';
  } catch (err) { msg.className = 'msg err'; msg.textContent = `not sent: ${err.message}`; card.querySelectorAll('button').forEach((x) => { x.disabled = false; }); }
});

// away mode
function renderAway() {
  const on = !!(state && state.away && state.away.on), b = $('#away');
  b.classList.toggle('on', on);
  b.innerHTML = `away from the computer: <b>${on ? 'on' : 'off'}</b>`;
}
$('#away').addEventListener('click', async () => {
  const on = !(state && state.away && state.away.on);
  try {
    const r = await fetch('api/away', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ on }) });
    if (r.ok) { state.away = await r.json(); renderAway(); }
  } catch {}
});

async function refresh() {
  try {
    const r = await fetch('api/state', { cache: 'no-store' });
    if (r.status === 401) { location.href = `/login?next=${encodeURIComponent(location.pathname)}`; return; }   // outside session expired
    state = await r.json(); render(); renderDecisions(); renderAway();
  }
  catch (e) { $('#updated').textContent = 'no connection to the server'; }
}
// active agents' clocks
setInterval(() => {
  document.querySelectorAll('[data-since]').forEach((el) => { el.textContent = fmtDur(Date.now() - Number(el.dataset.since)); });
  document.querySelectorAll('[data-run-start]').forEach((el) => { if (el.dataset.runStart) el.textContent = fmtDur(Date.now() - Number(el.dataset.runStart)); });
}, 1000);
// real time: SSE, with fallback polling
function connect() {
  const es = new EventSource('events');
  es.onopen = () => { liveOk = true; $('#live').classList.add('on'); };
  es.addEventListener('update', refresh);
  es.onerror = () => { liveOk = false; $('#live').classList.remove('on'); };
}
connect();
refresh();
setInterval(() => { if (!liveOk) refresh(); }, 5000);
</script>
</body>
</html>
