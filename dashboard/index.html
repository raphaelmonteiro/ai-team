<link rel="stylesheet" href="ui.css">
<style>
  main { padding: 16px 20px 80px; max-width: 1400px; margin: 0 auto; }
  h2 .n.silent { background: transparent; color: var(--muted); font-weight: 500; margin-left: 2px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .tile, .card { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; cursor: pointer; transition: border-color .15s; }
  .tile:hover, .card:hover { border-color: var(--accent); }
  .tile .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .tile .big { font-size: 20px; font-weight: 700; margin: 4px 0 2px; }
  .tile .sub, .card .sub { color: var(--muted); font-size: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 12px; }
  .card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card .id { font-weight: 700; font-size: 15px; word-break: break-all; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .metrics { display: flex; gap: 14px; margin: 10px 0 6px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .metrics b { color: var(--ink); font-weight: 600; }
  .active { margin-top: 8px; padding: 8px 10px; border-radius: 4px; background: var(--chip); }
  .active .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .active .row + .row { margin-top: 4px; }
  .agents { margin-top: 8px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
  .agents .row { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  .agents .row b { color: var(--ink); font-weight: 600; min-width: 110px; }
  .bar { height: 4px; border-radius: 2px; background: var(--line); flex: 1; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  #decisions { max-width: 1400px; margin: 0 auto; padding: 16px 20px 0; }
  .dec { background: var(--card); border: 1px solid var(--warn); border-radius: 4px; padding: 12px 14px; margin-top: 10px; }
  .dec .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .dec .cmd { margin: 8px 0; padding: 8px 10px; border-radius: 4px; background: var(--soft); font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow: auto; }
  .dec .q { font-weight: 600; margin: 10px 0 4px; }
  .dec label.o { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; cursor: pointer; }
  .dec label.o .d { color: var(--muted); font-size: 12px; }
  .dec input[type=text] { width: 100%; padding: 6px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  .dec .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .dec button { font: inherit; padding: 5px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); cursor: pointer; }
  .dec button.pri { background: var(--inv); border-color: var(--inv); color: var(--onv); } .dec button.pri:hover { background: var(--ink2); } .dec button:hover:not(:disabled) { border-color: var(--line2); }
  .dec button:disabled { opacity: .5; cursor: default; }
  .dec .msg { font-size: 12px; color: var(--muted); }
  .dec .msg.err { color: var(--bad); }
  .awaybtn { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 4px; border: 1px solid var(--line); background: var(--soft); color: var(--muted); cursor: pointer; }
  .awaybtn.on { border-color: var(--warn); color: var(--warn); background: var(--warnbg); }
  .dec .ctx { margin: 6px 0; font-size: 12.5px; color: var(--muted); white-space: pre-wrap; max-height: 120px; overflow: auto; }
  .dec .opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .dec.expired { border-style: dashed; } .dec .opt { font-size: 12px; padding: 2px 9px; border-radius: 6px; border: 1px dashed var(--line2); color: var(--muted); cursor: default; }
  .dec.expired .note { margin-top: 8px; color: var(--warn); }
  .dec textarea { width: 100%; min-height: 60px; padding: 6px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  .sesss { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(380px, 100%), 1fr)); gap: 12px; margin-top: 12px; }
  .recap { margin-top: 8px; font-size: 12px; color: var(--muted); }
  /* drawer */
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--card); border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .2s; z-index: 5; overflow: auto; }
  #drawer.open { transform: none; box-shadow: -8px 0 30px var(--shadow); }
  #drawer .head { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 18px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  #drawer .head h3 { margin: 0; font-size: 16px; }
  #drawer .body { padding: 14px 18px; }
  #drawer button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.run { cursor: pointer; } tr.run:hover td { background: var(--chip); }
  tr.detail td { background: var(--bg); color: var(--muted); white-space: pre-wrap; font-size: 12px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .st { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .st.running { background: var(--live); animation: pulse 1.6s infinite; } .st.finished { background: var(--muted); } .st.failed { background: var(--bad); } .st.stale { background: var(--amber); }
  .legend { color: var(--muted); font-size: 11.5px; margin: 8px 0 0; }
  .wait { margin-top: 8px; padding: 6px 10px; border-radius: 4px; border: 1px dashed var(--line); font-size: 12.5px; }
  .wait b { font-weight: 600; } .wait.undef b { color: var(--muted); }
  .wait .rule { color: var(--muted); font-size: 11.5px; display: block; margin-top: 2px; }
  .card.over { border-color: var(--warn); }
  /* since you left */
  #since { margin: 0 0 14px; border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; background: var(--card); }
  #since summary { cursor: pointer; font-weight: 600; font-size: 13.5px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  #since summary .sub { font-weight: 400; } #since summary button { margin-left: auto; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 4px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
  #since .grp { margin: 8px 0 4px; } #since .grp h4 { margin: 0 0 2px; font-size: 12.5px; }
  #since .tl { margin: 0; padding: 0; list-style: none; } #since .tl li { font-size: 12.5px; padding: 2px 0 2px 14px; position: relative; color: var(--ink); }
  #since .tl li::before { content: ''; position: absolute; left: 2px; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  #since .tl li.ok::before { background: var(--ok); } #since .tl li.warn::before { background: var(--warn); } #since .tl li.bad::before { background: var(--bad); }
  #since .tl .t { color: var(--muted); font-size: 11.5px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .stuckbox { margin-top: 8px; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--bad); font-size: 12.5px; }
  .stuckbox .why { color: var(--muted); font-size: 11.5px; display: block; margin: 2px 0 6px; white-space: pre-wrap; word-break: break-word; }
  .stuckbox code { background: var(--chip); padding: 2px 6px; border-radius: 5px; user-select: all; }
  .stuckbox button { margin-left: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 4px; padding: 1px 8px; cursor: pointer; font-size: 11.5px; }
  .secs { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .secs .row { display: flex; gap: 8px; align-items: center; } .secs .row span:first-child { min-width: 78px; }
  .secs .bar i { background: var(--ok); }
  .mini { width: 100%; margin-top: 8px; font-size: 12px; } .mini td, .mini th { padding: 2px 4px; }
  details.older > summary { cursor: pointer; color: var(--muted); font-size: 13px; margin: 12px 0 8px; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
  .files a.cur { background: var(--inv); color: var(--onv); }
  /* a change's .md rendered in the drawer */
  .doc { font-size: 13.5px; line-height: 1.5; } .doc h1 { font-size: 18px; } .doc h2 { font-size: 15.5px; margin-top: 18px; } .doc h3 { font-size: 14px; }
  .doc pre { background: var(--soft); border-radius: 4px; padding: 8px 10px; overflow: auto; font-size: 12px; } .doc code { background: var(--soft); padding: 1px 4px; border-radius: 4px; font-size: 12px; }
  .doc table { border-collapse: collapse; margin: 8px 0; } .doc th, .doc td { border: 1px solid var(--line); padding: 3px 8px; font-size: 12.5px; vertical-align: top; }
  .doc blockquote { border-left: 3px solid var(--line); margin: 8px 0; padding: 2px 10px; color: var(--muted); } .doc .marker { color: var(--muted); font-size: 11.5px; }
  .doc .jumped { background: var(--warnbg); } .dochead { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; flex-wrap: wrap; } .dochead .anchors a { margin-right: 6px; font-size: 12px; }
  /* the change's diff */
  .diff .repo { margin: 6px 0 14px; } .diff .repo h4 { margin: 8px 0 4px; font-size: 13px; }
  .diff .commits { font-size: 12.5px; margin: 0 0 8px; } .diff .commits code { background: var(--chip); padding: 0 4px; border-radius: 4px; }
  .diff details { border: 1px solid var(--line); border-radius: 4px; margin: 4px 0; } .diff summary { padding: 4px 8px; cursor: pointer; font-size: 12.5px; display: flex; gap: 8px; align-items: baseline; }
  .diff summary .p { font-family: var(--mono); word-break: break-all; } .diff summary .add { color: var(--ok); } .diff summary .del { color: var(--bad); } .diff summary .sub { margin-left: auto; }
  .diff pre { margin: 0; padding: 6px 8px; border-top: 1px solid var(--line); overflow: auto; font-size: 11.5px; line-height: 1.4; max-height: 70vh; }
  .diff pre .a { color: var(--ok); background: var(--okbg); display: block; } .diff pre .d { color: var(--bad); background: var(--badbg); display: block; } .diff pre .h { color: var(--muted); display: block; } .diff pre .m { color: var(--muted); display: block; }
  .files a { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--chip); color: var(--accent); text-decoration: none; }
  .card.slim { padding: 8px 12px; }
  .flow { color: var(--muted); white-space: nowrap; }
  .flow b { color: var(--ink); font-weight: 600; }
  .note { color: var(--muted); font-size: 12px; margin-top: 10px; }

  /* change flow (drawer) */
  .now { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 4px; background: var(--soft); border: 1px solid var(--line); margin-bottom: 4px; }
  .now + .now { margin-top: 6px; }
  .now .txt { flex: 1; min-width: 0; } .now .txt b { font-weight: 600; }
  .now .sub { color: var(--muted); font-size: 12.5px; }
  .now .next { font-size: 12.5px; color: var(--muted); text-align: right; white-space: nowrap; }
  .now .rule { color: var(--muted); font-size: 11.5px; }
  .av { position: relative; width: 26px; height: 26px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 10px; display: inline-flex; align-items: center; justify-content: center; flex: none; border: 2px solid var(--card); cursor: pointer; user-select: none; }
  .av.lg { width: 42px; height: 42px; font-size: 14px; cursor: default; }
  .av i { position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--card); background: var(--muted); }
  .av.lg i { width: 13px; height: 13px; }
  .av i.on { background: var(--ok); animation: pulse 1.6s infinite; } .av i.wait { background: var(--warn); } .av i.stale { background: var(--amber); } .av i.failed { background: var(--bad); }
  .src { font-size: 11px; color: var(--muted); } .src.decl { color: var(--ok); } .warnline { color: var(--warn); font-size: 11.5px; display: block; margin-top: 2px; }
  .sess { color: var(--muted); font-size: 11.5px; }
  .av.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* v3: neutral avatars (initials in mono); the dot in the corner carries the state */
  .av { color: var(--ink2); border: 1px solid var(--line2); border-radius: 6px; font-family: var(--mono); font-weight: 600; }
  .av i { border-color: var(--bg); }
  .steps { display: grid; grid-template-columns: repeat(var(--n, 7), minmax(0, 1fr)); margin-top: 12px; }
  .step { text-align: center; position: relative; padding: 0 3px; }
  .step::before { content: ""; position: absolute; top: 15px; left: -50%; width: 100%; height: 2px; background: var(--line); }
  .step:first-child::before { display: none; }
  .step.s-done::before, .step.s-active::before { background: var(--ok); }
  .step .sdot { position: relative; z-index: 1; width: 32px; height: 32px; margin: 0 auto; border-radius: 50%; border: 2px solid var(--line); background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); font-weight: 600; }
  .step.s-done .sdot { background: var(--ok); border-color: var(--ok); color: var(--onv); }
  .step.s-active .sdot { border-color: var(--ok); color: var(--ok); box-shadow: 0 0 0 4px var(--okbg); }
  .step.loop .sdot { border-style: dashed; }
  .step .lbl { font-size: 12.5px; font-weight: 600; margin-top: 6px; } .step.s-pending .lbl { color: var(--muted); font-weight: 500; }
  .step .who { font-size: 11px; color: var(--muted); }
  .step .times { color: var(--accent); font-weight: 700; margin-left: 3px; }
  .step .avs { display: flex; justify-content: center; margin-top: 8px; min-height: 28px; }
  .step .avs .av + .av { margin-left: -8px; }
  .step .meta { font-size: 11px; color: var(--muted); margin-top: 4px; } .step.s-active .meta { color: var(--ok); font-weight: 600; }

  }

  /* conversation (default view of the change drawer) */

  .msg .c { font-size: 13px; margin-top: 2px; word-break: break-word; }

  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  .unk { font-size: 12.5px; color: var(--muted); border: 1px dashed var(--warn); border-radius: 4px; padding: 8px 12px; margin-top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .unk .avs { display: flex; } .unk .avs .av + .av { margin-left: -8px; }
  /* presence card */
  #hc { position: fixed; z-index: 10; width: 320px; max-width: calc(100vw - 16px); background: var(--card); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 12px 32px var(--shadow); padding: 14px; display: none; font-size: 12.5px; pointer-events: none; }

  /* v2 terminal theme: data in mono, prose in sans, color only for state */
  .card .id, .tile .big, .metrics, .chips, .secs, .mini, .sess, .flow, .step .meta, .now .sub, #since .tl .t, .dec .top .sub { font-family: var(--mono); }
  .card .id { font-weight: 500; font-size: 14px; color: var(--ink2); }

  /* board toolbar: view switch and filter. One node kept across renders and moved into the Changes heading, so typing survives */

  #tools .vt button { font: 12px var(--sans); border: 0; background: transparent; color: var(--muted); padding: 3px 9px; cursor: pointer; }
  #tools .vt button.cur { background: var(--soft); color: var(--ink2); }
  #tools .sub { color: var(--muted); font-size: 12px; }
  /* v3 IDE shell: activity bar, explorer, editor (tabs + scroller) and the status bar at the bottom */
  html, body { height: 100%; }
  body { display: grid; grid-template-rows: minmax(0, 1fr) 28px; grid-template-columns: minmax(0, 1fr); height: 100vh; overflow: hidden; }
  .ide { display: flex; min-height: 0; min-width: 0; }

  .side { width: var(--side-w, 280px); flex: none; background: var(--head); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }

  .side-h { height: 35px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 14px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

  .side-f { padding: 0 10px 8px; flex: none; position: relative; }

  .side-f input { width: 100%; font: 12px var(--mono); padding: 5px 9px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .side-f input:focus { outline: none; border-color: var(--line2); }
  .side-f .kbd { position: absolute; right: 16px; top: 5px; }
  .tree { overflow: auto; flex: 1; padding-bottom: 12px; }
  .tg { display: flex; align-items: center; gap: 4px; height: 24px; width: 100%; padding: 0 12px 0 6px; border: 0; background: transparent; font: 600 11px var(--sans); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); cursor: pointer; text-align: left; }

  .ti:hover { background: var(--soft); }
  .ti.cur { background: var(--linkbg); color: var(--ink2); }
  .ti:focus { outline: none; } .ti:focus-visible { box-shadow: inset 2px 0 0 var(--accent); background: var(--soft); }
  .ti .g { width: 12px; flex: none; text-align: center; font-size: 11px; color: var(--muted); }
  .ti .g.ok { color: var(--ok); } .ti .g.warn { color: var(--warn); } .ti .g.bad { color: var(--bad); }
  .ti .id { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ti .meta { flex: none; color: var(--muted); font-size: 11px; }
  .tnone { padding: 2px 12px 4px 46px; color: var(--muted); font-size: 12px; }
  .split { width: 5px; margin: 0 -3px 0 -2px; flex: none; cursor: col-resize; z-index: 2; position: relative; }
  .split:hover, .split.drag { background: var(--line2); }
  .center { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .etabs { height: 35px; flex: none; display: flex; background: var(--head); border-bottom: 1px solid var(--line); overflow-x: auto; }
  .etab { display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); font: 12.5px var(--mono); white-space: nowrap; position: relative; cursor: pointer; }

  .etab.cur::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--bg); }
  .scroller { flex: 1; overflow: auto; min-height: 0; }
  .etab .g { font-size: 11px; color: var(--muted); } .etab .g.ok { color: var(--ok); } .etab .g.warn { color: var(--warn); } .etab .g.bad { color: var(--bad); }

  .etab:hover .x, .etab.cur .x { opacity: .7; } .etab .x:hover { opacity: 1; background: var(--soft); }
  /* a change or an agent open as a tab: the old drawer, now inside the editor */
  #drawer.tabview { position: static; transform: none; width: auto; flex: 1; min-height: 0; overflow: auto; border-left: 0; box-shadow: none; background: var(--bg); transition: none; z-index: auto; }
  #drawer.tabview[hidden] { display: none; }
  #drawer.tabview:focus { outline: none; }
  #drawer.tabview .head { background: var(--bg); padding: 12px 24px; z-index: 2; }
  #drawer.tabview .body { padding: 14px 24px 40px; }
  /* bottom panel: PROBLEMS (decisions first), EVENTS (the since-you-left log), OUTPUT */
  :root[data-panel="off"] .panel, :root[data-panel="off"] #splitpanel { display: none; }
  .split.h { width: auto; height: 5px; margin: -3px 0 -2px; cursor: row-resize; }
  .panel { height: var(--panel-h, 240px); max-height: 60vh; flex: none; display: flex; flex-direction: column; border-top: 1px solid var(--line); background: var(--bg); min-height: 0; }
  .ptabs { height: 32px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 8px 0 12px; }
  .ptabs .grow { flex: 1; }
  .ptab { border: 0; background: transparent; color: var(--muted); font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; padding: 0 8px; height: 32px; cursor: pointer; position: relative; display: inline-flex; align-items: center; gap: 6px; }
  .ptab:hover, .ptab.cur { color: var(--ink2); }
  .ptab.cur::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 4px; height: 1px; background: var(--ink2); }
  .ptab .c { font: 500 10.5px var(--mono); letter-spacing: 0; padding: 0 5px; border-radius: 8px; background: var(--soft); color: var(--ink); }
  .ptab .c.warn { background: var(--warnbg); color: var(--warn); } .ptab .c.bad { background: var(--badbg); color: var(--bad); } .ptab .c.new { background: var(--linkbg); color: var(--accent); }
  .pic { border: 0; background: transparent; color: var(--muted); width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-size: 15px; margin-left: 6px; }
  .pic:hover { background: var(--soft); color: var(--ink2); }
  .pbody { flex: 1; overflow: auto; min-height: 0; }
  .pbody[hidden] { display: none; }
  .prob .who:hover { text-decoration: underline; }
  .prob { display: flex; gap: 10px; align-items: center; min-height: 30px; padding: 4px 16px; border-bottom: 1px solid var(--line); font-size: 12.5px; cursor: pointer; }
  .prob:hover, .prob:focus-visible { background: var(--soft); outline: none; }
  .prob .g { width: 12px; flex: none; text-align: center; font: 12px var(--mono); }
  .prob .g.bad { color: var(--bad); } .prob .g.warn { color: var(--warn); }
  .prob .who { font: 500 12.5px var(--mono); color: var(--ink2); flex: none; }

  .prob code { font: 12px var(--mono); background: var(--card); border: 1px solid var(--line); border-radius: 3px; padding: 1px 7px; }
  .prob button { font: 11.5px var(--sans); border: 1px solid var(--line2); background: transparent; color: var(--ink); border-radius: 4px; padding: 1px 8px; cursor: pointer; }
  .pempty { padding: 16px; color: var(--muted); font-size: 12.5px; }

  .evmark::before, .evmark::after { content: ""; height: 1px; background: var(--linkbg); flex: 1; }
  .evmark button { font: 11px var(--mono); border: 1px solid var(--line2); background: transparent; color: var(--ink); border-radius: 4px; padding: 0 8px; cursor: pointer; }
  /* tasks kanban: state colors on borders and meta; kind badges with their own palette */
  :root { --k-back: #5b9cff; --k-front: #b18cff; --k-infra: #3fc1d0; --k-invest: #f07ab8; --k-test: #ff9966; --k-docs: #9aa5b1; --k-review: #c9a0ff; }
  :root[data-theme="light"] { --k-back: #1f5fd1; --k-front: #7a3fd6; --k-infra: #0b7f8c; --k-invest: #c0337b; --k-test: #c4501d; --k-docs: #5f6b78; --k-review: #8a4fd0; }
  :root[data-theme="fallout"] { --k-back: #1aff80; --k-front: #a6ffcb; --k-infra: #3fe0c4; --k-invest: #ffb642; --k-test: #ff8a3d; --k-docs: #6fae85; --k-review: #d4ff5a; }
  /* fallout: the open item in the explorer and the chosen view as the Pip-Boy's inverted bar (glyph and meta too) */

  /* fallout: the Pip-Boy's tabs in capitals and wide tracking (STAT INV DATA), its bottom bar as a row of filled

  :root[data-theme="fallout"] .tg, :root[data-theme="fallout"] .ptab, :root[data-theme="fallout"] .slbl, :root[data-theme="fallout"] .m-sec { letter-spacing: .12em; }

  b.classList.toggle('on', on);
  b.innerHTML = `Away: <b>${on ? 'on' : 'off'}</b>${on && state.away.since ? ` <span class="sub">since ${esc(fmtTime(state.away.since))}</span>` : ''}`;
  b.setAttribute('aria-pressed', String(on));
  renderMobile();
}
$('#away').addEventListener('click', async () => {
  const on = !(state && state.away && state.away.on);
  try {
    const r = await fetch('api/away', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ on }) });
    if (r.ok) { state.away = await r.json(); renderAway(); }
  } catch {}
});

// the SSE notice, the fallback poll and the first load all fetch: only the newest response is applied
let fetchSeq = 0;
async function refresh() {
  const my = ++fetchSeq;
  try {
    const r = await fetch('api/state', { cache: 'no-store' });
    if (r.status === 401) { location.href = `/login?next=${encodeURIComponent(location.pathname)}`; return; }   // outside session expired
    const next = await r.json();
    if (my !== fetchSeq || (state && next.generatedAt && state.generatedAt && next.generatedAt < state.generatedAt)) return;   // an older answer that arrived late
    state = next; setOffline(false); render(); renderDecisions(); renderAway();
  }
  catch (e) { if (my === fetchSeq) setOffline(true); }
}
// clocks: elapsed since (data-since), running for (data-run-start), silent for (data-silent); filled right
// after each render too, so the HTML of the page does not change with the clock
function tick() {
  const now = Date.now();
  document.querySelectorAll('[data-since]').forEach((el) => { el.textContent = fmtDur(now - Number(el.dataset.since)); });
  document.querySelectorAll('[data-run-start]').forEach((el) => { if (el.dataset.runStart) el.textContent = fmtDur(now - Number(el.dataset.runStart)); });
  document.querySelectorAll('[data-silent]').forEach((el) => { el.textContent = fmtDur(now - Number(el.dataset.silent)); });
}
setInterval(tick, 1000);
// real time: SSE, with fallback polling
function connect() {
  const es = new EventSource('events');
  es.onopen = () => { liveOk = true; renderStatus(); };
  es.addEventListener('update', refresh);
  es.onerror = () => { liveOk = false; renderStatus(); };
}
// ---- board toolbar: view switch and filter ----
function setBoardView(v) {
  keepBoardView(v);
  document.querySelectorAll('#tools [data-boardview]').forEach((b) => { b.classList.toggle('cur', b.dataset.boardview === ui.boardView); b.setAttribute('aria-pressed', String(b.dataset.boardview === ui.boardView)); });
  lastMainHtml = ''; render();
}
$('#tools').addEventListener('click', (e) => { const b = e.target.closest('[data-boardview]'); if (b) setBoardView(b.dataset.boardview); });
$('#cfilter').addEventListener('input', (e) => { ui.filter = e.target.value; applyFilter(); renderTree(); });
$('#cfilter').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.stopPropagation(); e.target.value = ''; ui.filter = ''; applyFilter(); renderTree(); e.target.blur(); }
  else if (e.key === 'ArrowDown') { const f = $('#tree .ti'); if (f) { e.preventDefault(); f.focus(); } }
});
document.querySelectorAll('#tools [data-boardview]').forEach((b) => b.classList.toggle('cur', b.dataset.boardview === ui.boardView));

// ---- command palette ----
const mac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
if (!mac) { $('#palbtn').title = 'Search or run a command (Ctrl K)'; $('#actside').title = 'Explorer (Ctrl B)'; $('#dclosekey').textContent = 'Alt W'; }
const SHORTCUTS = helpRows(mac);   // the "?" list, built from the keymap (keys.mjs)
const palette = mountPalette(() => {
  if (!state || state.error) return baseCommands();
  const ch = state.changes.filter((c) => c.kind !== 'no-change').map((c) => ({ group: 'Changes', label: c.title || c.id, hint: `${stageOf(c)[0]}${c.activeAgents.length ? ` · ${c.activeAgents.map((a) => a.agent).join(', ')} running` : ''}`, run: () => openDrawer('change', c.id) }));
  const ag = state.agents.map((a) => ({ group: 'Agents', label: a.agent, hint: `${a.runs} run(s) · ${fmtUsd(a.usd)}`, run: () => openDrawer('agent', a.agent) }));
  const on = !!(state.away && state.away.on);
  const acts = [
    ...(state.board.stuck || []).map((id) => state.changes.find((c) => c.id === id)).filter((c) => c && c.stuck).map((c) => ({ group: 'Actions', label: `Copy ${c.stuck.resume}`, hint: 'resume the stuck change', run: () => copyText(c.stuck.resume) })),
    { group: 'Actions', label: `Turn ${on ? 'off' : 'on'} "away from the computer"`, run: () => $('#away').click() },
    { group: 'Actions', label: 'Mark "since you left" as seen', run: () => { markSeen(projDir()); lastMainHtml = ''; render(); } },
    { group: 'Actions', label: `Show changes as ${ui.boardView === 'table' ? 'cards' : 'a table'}`, run: () => setBoardView(ui.boardView === 'table' ? 'cards' : 'table') },
    { group: 'Actions', label: `${layout.panel ? 'Hide' : 'Show'} the panel`, keys: ['ctrl `'], run: () => showPanel(layout.panelTab, !layout.panel) },
    { group: 'Actions', label: 'Show Problems', run: () => showPanel('problems') },
    { group: 'Actions', label: 'Show Events (since you left)', run: () => showPanel('events') },
    { group: 'Actions', label: 'Copy the project path', hint: state.project.dir, run: () => copyText(state.project.dir) },
    { group: 'Actions', label: 'Keyboard shortcuts', keys: ['?'], run: () => palette.help(SHORTCUTS) },
  ];
  const tabsCmds = [{ group: 'Pages', label: 'Open Team', run: () => openTab('team', 'team') }, { group: 'Pages', label: 'Open Settings', hint: 'notifications, appearance, project keys', run: () => openTab('settings', 'settings') }];
  return [...ch, ...ag, ...acts, ...tabsCmds, ...baseCommands({})];
});
$('#palbtn').addEventListener('click', () => palette.open());
// the hub forwards ⌘K pressed on its own header; the theme or CRT changed in another page of this browser
addEventListener('message', (e) => { if (e.origin === location.origin && e.data === 'ai-team:palette') palette.open(); });
followTheme(() => { if (drawer && drawer.kind === 'settings') renderTab(true); lastMHtml = ''; renderMobile(); });
addEventListener('hashchange', tellHub);

// ---- keyboard: one dispatcher over the keymap (keys.mjs); what each shortcut does, by id ----
const navItems = () => [...document.querySelectorAll('#decisions .dec, #main [data-change].crow, #main .card[data-change], #main [data-sess]')].filter((el) => el.offsetParent !== null);
function moveFocus(step) {
  const items = navItems(); if (!items.length) return false;
  const cur = items.findIndex((el) => el === document.activeElement || el.contains(document.activeElement));
  const next = items[cur < 0 ? 0 : Math.min(Math.max(cur + step, 0), items.length - 1)];
  next.focus({ preventScroll: true }); next.scrollIntoView({ block: 'nearest' });
}
function decideFocused(act) {
  const dec = document.activeElement.closest('.dec'), b = dec && dec.querySelector(`button[data-act="${act}"]`);
  if (!b || b.disabled) return false;
  decide(b);
}
// each action returns false when it did nothing (the key then keeps its default)
const KEY_ACTIONS = {
  next: () => moveFocus(1),
  prev: () => moveFocus(-1),
  allow: () => decideFocused('allow'),
  deny: () => decideFocused('deny'),
  filter: () => { if (!layout.side || innerWidth <= 760) toggleSide(true); $('#cfilter').focus(); },
  side: () => toggleSide(),
  panel: () => showPanel(layout.panelTab, !layout.panel),
  // Alt+1 Overview, Alt+2…8 the tabs, Alt+9 the last (⌘1…9 and ⌘W belong to the browser)
  tab: (n) => activateTab(n === 1 ? -1 : n === 9 ? tabs.length - 1 : Math.min(n - 2, tabs.length - 1)),
  close: () => (drawer ? closeDrawer() : false),
  back: () => (drawer ? activateTab(-1) : false),
  help: () => palette.help(SHORTCUTS),
};
document.addEventListener('keydown', (e) => {
  const ae = document.activeElement;
  const hit = matchKey(e, { mac, typing: typing(e), paletteOpen: palette.isOpen(), inTab: !!drawer, inDecision: !!(ae && ae.closest && ae.closest('.dec')) });
  if (!hit || hit.handledBy) return;
  const act = KEY_ACTIONS[hit.id]; if (!act) return;
  if (act(hit.arg) !== false) e.preventDefault();
});

applyMobile(); openInboxHash();
connect();
refresh();
setInterval(() => { if (!liveOk) refresh(); }, 5000);
</script>
</body>
