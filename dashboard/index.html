<style>

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }

  .card.over { border-color: var(--warn); }

  #since summary .sub { font-weight: 400; } #since summary button { margin-left: auto; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 4px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
  #since .grp { margin: 8px 0 4px; } #since .grp h4 { margin: 0 0 2px; font-size: 12.5px; }

  #since .tl li::before { content: ''; position: absolute; left: 2px; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  #since .tl li.ok::before { background: var(--ok); } #since .tl li.warn::before { background: var(--warn); } #since .tl li.bad::before { background: var(--bad); }
  #since .tl .t { color: var(--muted); font-size: 11.5px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .stuckbox { margin-top: 8px; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--bad); font-size: 12.5px; }

  .secs { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .secs .row { display: flex; gap: 8px; align-items: center; } .secs .row span:first-child { min-width: 78px; }
  .secs .bar i { background: var(--ok); }
  .mini { width: 100%; margin-top: 8px; font-size: 12px; } .mini td, .mini th { padding: 2px 4px; }
  details.older > summary { cursor: pointer; color: var(--muted); font-size: 13px; margin: 12px 0 8px; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }

  /* a change's .md rendered in the drawer */
  .doc { font-size: 13.5px; line-height: 1.5; } .doc h1 { font-size: 18px; } .doc h2 { font-size: 15.5px; margin-top: 18px; } .doc h3 { font-size: 14px; }
  .doc pre { background: var(--soft); border-radius: 4px; padding: 8px 10px; overflow: auto; font-size: 12px; } .doc code { background: var(--soft); padding: 1px 4px; border-radius: 4px; font-size: 12px; }
  .doc table { border-collapse: collapse; margin: 8px 0; } .doc th, .doc td { border: 1px solid var(--line); padding: 3px 8px; font-size: 12.5px; vertical-align: top; }
  .doc blockquote { border-left: 3px solid var(--line); margin: 8px 0; padding: 2px 10px; color: var(--muted); } .doc .marker { color: var(--muted); font-size: 11.5px; }
  .doc .jumped { background: var(--warnbg); } .dochead { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; flex-wrap: wrap; } .dochead .anchors a { margin-right: 6px; font-size: 12px; }
  /* the change's diff */
  .diff .repo { margin: 6px 0 14px; } .diff .repo h4 { margin: 8px 0 4px; font-size: 13px; }
  .diff .commits { font-size: 12.5px; margin: 0 0 8px; } .diff .commits code { background: var(--chip); padding: 0 4px; border-radius: 4px; }
  .diff details { border: 1px solid var(--line); border-radius: 4px; margin: 4px 0; } .diff summary { padding: 4px 8px; cursor: pointer; font-size: 12.5px; display: flex; gap: 8px; align-items: baseline; }
  .diff summary .p { font-family: var(--mono); word-break: break-all; } .diff summary .add { color: var(--ok); } .diff summary .del { color: var(--bad); } .diff summary .sub { margin-left: auto; }

  .files a { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--chip); color: var(--accent); text-decoration: none; }
  .card.slim { padding: 8px 12px; }
  .flow { color: var(--muted); white-space: nowrap; }
  .flow b { color: var(--ink); font-weight: 600; }

  /* change flow (drawer) */

  .av { position: relative; width: 26px; height: 26px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 10px; display: inline-flex; align-items: center; justify-content: center; flex: none; border: 2px solid var(--card); cursor: pointer; user-select: none; }

  .src { font-size: 11px; color: var(--muted); } .src.decl { color: var(--ok); } .warnline { color: var(--warn); font-size: 11.5px; display: block; margin-top: 2px; }

  /* v2 terminal theme: data in mono, prose in sans, color only for state */

  /* board toolbar: view switch and filter. One node kept across renders and moved into the Changes heading, so typing survives */

  /* v3 IDE shell: activity bar, explorer, editor (tabs + scroller) and the status bar at the bottom */

  .ti .id { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ti .meta { flex: none; color: var(--muted); font-size: 11px; }
  .tnone { padding: 2px 12px 4px 46px; color: var(--muted); font-size: 12px; }
  .split { width: 5px; margin: 0 -3px 0 -2px; flex: none; cursor: col-resize; z-index: 2; position: relative; }

  .center { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .etabs { height: 35px; flex: none; display: flex; background: var(--head); border-bottom: 1px solid var(--line); overflow-x: auto; }

  .scroller { flex: 1; overflow: auto; min-height: 0; }

  /* a change or an agent open as a tab: the old drawer, now inside the editor */

  /* bottom panel: PROBLEMS (decisions first), EVENTS (the since-you-left log), OUTPUT */

  .pic { border: 0; background: transparent; color: var(--muted); width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-size: 15px; margin-left: 6px; }

  /* tasks kanban: state colors on borders and meta; kind badges with their own palette */

<script type="module">

const $ = (s, el = document) => el.querySelector(s);
// ---- IDE shell: explorer width, visibility and folded groups are kept per browser ----
const store = (() => { try { return localStorage; } catch { return { getItem: () => null, setItem: () => {} }; } })();
const layout = loadLayout(store);
function applyLayout() {

applyLayout();
function toggleSide(on = !layout.side) { layout.side = on; saveLayout(store, layout); applyLayout(); }
let state = null, drawer = null, liveOk = false, offline = false;
// changes board: one dense table (default) or the cards; the choice and the filter live in this browser / tab
let boardView = (() => { try { return localStorage.getItem('ai-team:boardview') === 'cards' ? 'cards' : 'table'; } catch { return 'table'; } })();
let boardFilter = '';
// what the person opened survives the re-render on every update: <details> by id, the drawer's scroll
// and expanded rows (openDrawer), the typed text of a decision (renderDecisions)
const openDetails = new Set();
let lastMainHtml = '', lastDrawerHtml = '', opener = null;
// agents are not colored by name (v3): color only means a state; an agent is its initials in mono
const colorOf = () => 'var(--line2)';
const TIP_NEW = 'fresh: input + output + cache written (cache creation); does not include cache read';
const TIP_CACHE = 'cache read: tokens read from the prompt cache (cache read), reused on every call; usually much larger than the fresh ones';
const TIP_USD = 'estimated cost at the API list price of each model (input, output, cache read and cache written); not a bill: plans, batch discounts and a subscription make the real figure differ';
const usdCol = (u) => `<td class="num" title="${TIP_USD}">${fmtUsd(u)}</td>`;
const tokCols = (t) => `<td class="num" title="${TIP_NEW}">${fmtTok(t.fresh)}</td><td class="num" title="${TIP_CACHE}">${fmtTok(t.cached)}</td>`;
const tokHeads = `<th class="num" title="${TIP_NEW}">fresh</th><th class="num" title="${TIP_CACHE}">cache read</th>`;
const usdHead = `<th class="num" title="${TIP_USD}">cost</th>`;
// last test run of a round or of a change (gate.mjs): verdict and counts, the command and its summary in the tooltip

  const fails = ok ? [] : (x.parts || [x]).flatMap((p) => p.failures || []);

  return `<span class="${cls} ${ok ? 'ok' : 'bad'}" title="${esc(lines)}${x.agent ? ` (${esc(x.agent)})` : ''}">tests ${ok ? '✓' : '✗'} ${n}</span>`;
}
// what a red test run says: who ran it and when, the command, the failing tests and the start of the output
function testFailHtml(x, { head = true } = {}) {
  if (!x || x.ok !== false) return '';
  const parts = (x.parts || [x]).filter((p) => p.ok === false);
  const body = parts.map((p) => `<div class="tfp"><code class="tcmd">$ ${esc(p.cmd || '?')}</code> <span class="sub">${esc(p.summary || '')}</span>
    ${p.failures && p.failures.length ? `<ul class="tfn">${p.failures.map((f) => `<li>✗ ${esc(f)}</li>`).join('')}</ul>` : '<p class="note">no test names in the output (the run failed before or the format is not recognised)</p>'}
    ${p.excerpt ? `<details class="tfx"${parts.length === 1 ? ' open' : ''}><summary>output</summary><pre>${esc(p.excerpt)}</pre></details>` : ''}</div>`).join('');

}
const changeLabel = (id) => !id ? '—' : id.startsWith('adhoc:') ? `ad-hoc · ${id.slice(6)}` : id;
function fmtDate(t) { return new Date(t).toLocaleDateString(undefined, { day: '2-digit', month: '2-digit', year: '2-digit' }); }
const liveDur = (r) => r.active && r.start ? Date.now() - r.start : r.durationMs;

function render() {
  if (!state) return;
  if (state.error) { $('#main').innerHTML = `<div class="empty">collector error:<br><pre style="text-align:left">${esc(state.error)}</pre></div>`; return; }
  $('#title').textContent = state.project.name; $('#sbproj').textContent = `>_ ${state.project.name}`;
  renderProjInfo();
  { const n = (state.pending || []).length; document.title = `${n ? `(${n}) ` : ''}${state.project.name} · ai-team`; }   // a waiting decision shows in the browser tab too
  renderStatus();
  const parts = [];
  // <details> keep what the person opened across re-renders

  // hooks not running: hook.sh found no node (marker written by the hook itself)

  if (state.hooks && state.hooks.noNode) {
    const nn = state.hooks.noNode;
    parts.push(`<div class="dec"><div class="top"><b>hooks are not running: <code>hook.sh</code> found no <code>node</code></b><span class="sub">${nn.since ? `since ${esc(fmtTime(nn.since))}` : ''}</span></div>
      <p class="note">No events (exact start and end of rounds), no role reminder after compaction and no phone notification until this is fixed. The hook looked on PATH, nvm, volta, fnm, Homebrew and /usr/local. Set <code>AI_TEAM_NODE=/path/to/node</code> in the app's environment or put node on its PATH; the warning goes away on the next hook.</p>
      ${nn.path ? `<div class="cmd">PATH=${esc(nn.path)}</div>` : ''}</div>`);
  }

  const nowRunning = state.running.filter((r) => r.status === 'running').length, nowSilent = state.running.length - nowRunning;
  parts.push(`<h2 id="agents">Agents now<span class="n">${nowRunning}</span>${nowSilent ? `<span class="n silent">+ ${nowSilent} without signal</span>` : ''}</h2>`);
  { const n = state.agentStates || {}; parts.push(`<p class="note"><span class="st running"></span>running ${n.running || 0} · <span class="st stale"></span>no signal ${n['no signal'] || 0} (limit ${state.staleMin} min) · <span class="st finished"></span>finished ${n.finished || 0} · <span class="st failed"></span>failed ${n.failed || 0} · interrupted ${n.interrupted || 0} <span class="sub">(all runs read)</span></p>`); }
  parts.push(state.running.length ? agentsTable(state.running, true) : `<div class="empty">no agent running</div>`);
  { const ss = sessionsHtml(state.mainRuns || []); if (ss) parts.push(ss); }
  if (state.recent.length) parts.push(det('recent', `finished recently (${state.recent.length}); "finished" does not mean success`, agentsTable(state.recent, false)));
  // changes
  const by = Object.fromEntries(state.changes.map((c) => [c.id, c]));
  const pick = (ids) => ids.map((i) => by[i]).filter(Boolean);
  const bd = state.board;
  const groups = [['Stuck', pick(bd.stuck || []), false, 'stuck'], ['In progress', pick(bd.running), true, 'running'], ['Blocked', pick(bd.blocked), false, 'blocked'], ['Pending', pick(bd.pending), false, 'pending']];

// ---- status line: one segment per thing that may need you; each count jumps to its section ----

  const el = e.target, k = el.dataset.set, ui = el.dataset.ui;
  if (ui === 'theme') { setTheme(el.value); return; }
  if (!k) return;
  if (k === 'ui:crt') { setCrt(el.checked); return; }
  if (k.startsWith('on:')) return saveNotify({ on: picked('on') });
  if (k.startsWith('projectOn:')) return saveNotify({ projectOn: picked('projectOn') });
  if (k === 'override') return saveNotify({ projectOn: el.checked ? (notifyView.project.on || notifyView.on) : null });
  if (k === 'detail' || k === 'quietAtComputer') return saveNotify({ [k]: el.checked });
  if (k === 'clearToken') { if (el.checked) saveNotify({ clearToken: true }); return; }
  if (k === 'token') { if (el.value) saveNotify({ token: el.value }); return; }
  if (['topic', 'server', 'dashboardUrl'].includes(k)) return saveNotify({ [k]: el.value.trim() });
});
$('#dbody').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('.settab input.in[data-set]')) { e.preventDefault(); e.target.blur(); } });
$('#dbody').addEventListener('input', (e) => { if (e.target.id === 'setq') filterSettings(); });
$('#dbody').addEventListener('click', async (e) => {
  if (!drawer) return;
  const ag = e.target.closest('[data-open-agent]'); if (ag) return openTab('agent', ag.dataset.openAgent);
  if (drawer.kind !== 'settings') return;
  const sc = e.target.closest('.setscope [data-scope]'); if (sc) { drawer.scope = sc.dataset.scope; return renderTab(true); }
  const toc = e.target.closest('[data-toc]'); if (toc) { const el = $('#dbody').querySelector(`.set[data-group="${CSS.escape(toc.dataset.toc)}"]:not([hidden])`); if (el) el.scrollIntoView({ block: 'start' }); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'gen-topic') { const r = new Uint8Array(9); crypto.getRandomValues(r); saveNotify({ topic: 'ai-team-' + [...r].map((b) => (b % 36).toString(36)).join('') }); }
  else if (a.dataset.act === 'content-off') saveNotify({ detail: false });
  else if (a.dataset.act === 'raw') { const pre = $('#dbody .setraw'), cols = $('#dbody .setcols'); pre.hidden = !pre.hidden; cols.hidden = !pre.hidden; a.textContent = pre.hidden ? (drawer.scope === 'project' ? 'Open the keys' : 'Open notify.json') : 'Open the UI'; }
  else if (a.dataset.act === 'reset-layout') { try { store.setItem('ai-team:layout', ''); store.setItem(TABS_KEY, ''); } catch { /* ignore */ } location.reload(); }
  else if (a.dataset.act === 'test') { setMsg('sending…'); try { const r = await fetch('api/notify/test', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' }); const o = await r.json().catch(() => ({})); if (!r.ok) throw new Error(o.error || r.status); setMsg('sent: check your phone', 'ok'); } catch (err) { setMsg(err.message, 'err'); } }
});
// the cycle block is fetched once, when its <details> opens
document.addEventListener('toggle', async (e) => {
  if (e.target.id !== 'cycle' || !e.target.open || cycleCache != null) return;
  try { const r = await fetch('cycle', { cache: 'no-store' }); cycleCache = r.ok ? await r.text() : '<p class="note">could not load the cycle</p>'; } catch { cycleCache = '<p class="note">could not load the cycle</p>'; }
  if ($('#cyclebox')) $('#cyclebox').innerHTML = cycleCache;
}, true);
$('#actdec').addEventListener('click', () => focusDecision());
// drag (or arrow keys on the focused handle) to resize the explorer
{
  const h = $('#splitside');
  h.addEventListener('pointerdown', (e) => {
    e.preventDefault(); h.setPointerCapture(e.pointerId); h.classList.add('drag');
    const x0 = e.clientX, w0 = layout.sideW;
    const move = (ev) => { layout.sideW = clampSide(w0 + ev.clientX - x0); applyLayout(); };
    const up = () => { h.classList.remove('drag'); h.removeEventListener('pointermove', move); saveLayout(store, layout); };
    h.addEventListener('pointermove', move); h.addEventListener('pointerup', up, { once: true });
  });
  h.addEventListener('keydown', (e) => { if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return; e.preventDefault(); layout.sideW = clampSide(layout.sideW + (e.key === 'ArrowRight' ? 16 : -16)); applyLayout(); saveLayout(store, layout); });
}

// open team sessions: step list (update_plan / TodoWrite) and pending question (wrap_up / AskUserQuestion)
const PLAN_IC = { completed: '✓', in_progress: '●', pending: '○' };
// the card options only show the question; answering through the dashboard only works while the hook waits (card in "Decisions")
function askHint(r, a) {
  const away = !!(state.away && state.away.on);
  const live = ((state && state.pending) || []).some((p) => p.sessionId === r.sessionId && (p.kind === 'question' || p.kind === 'reply'));
  if (live) return '<a href="#decisions">answer in the Problems panel</a>, or in the session';
  if (a.kind === 'wrap_up' && !away) return 'answer in the session (or turn on "away from the computer" to answer here next time)';
  return `the dashboard is no longer waiting for this answer (the time ran out or the hook is missing): answer in the session${away ? '' : '. With "away from the computer" on, the dashboard waits longer'}`;
}
function sessionsHtml(list) {
  const open = list.filter((r) => r.active && (r.plan || r.ask)).sort((a, b) => !!b.ask - !!a.ask || (b.end || 0) - (a.end || 0));
  if (!open.length) return '';
  const card = (r) => {
    const a = r.ask;
    const askBox = a ? a.questions.map((q) => `<div class="askbox"><div class="q">${esc(q.question)}</div>${q.options.length ? `<div class="opts">${q.options.map((o) => `<span class="opt" title="${esc(o.description)}">${esc(o.label)}</span>`).join('')}</div>` : ''}</div>`).join('')
      + `<div class="sub">${a.kind === 'question' ? 'question with options' : 'end-of-turn question'} since ${fmtTime(a.ts)} · ${askHint(r, a)}</div>` : '';
    const p = r.plan;
    const plan = p ? `<ul class="plan">${p.items.map((x) => `<li class="${x.status}"><span class="ic">${PLAN_IC[x.status]}</span><span>${esc(x.content)}</span></li>`).join('')}</ul>` : '';
    const recap = !a && r.recap && (!p || r.recap.ts >= p.ts) ? `<div class="recap">${esc(r.recap.text)}</div>` : '';
    const chg = r.change ? `<div class="chg sub">change: <span class="lnk" data-change="${esc(r.change)}" tabindex="0" role="button" title="open the change">${esc(changeLabel(r.change))}</span>${r.stage ? ` · ${esc(r.stage)}` : ''}</div>` : '';
    const extra = [r.gitBranch ? `branch ${esc(r.gitBranch)}` : '', r.interruptions ? `${r.interruptions} interruption${r.interruptions === 1 ? '' : 's'}` : ''].filter(Boolean).join(' · ');
    return `<div class="sesscard${a ? ' asking' : ''}"><div class="top"><span class="nm" title="${esc(r.sessionId)}">${esc(r.sessionName || r.sessionId.slice(0, 8))}</span>
      <span class="sub">${p ? `${p.done}/${p.total} steps · ` : ''}${r.live ? '<span class="badge ok">open</span>' : esc(r.status)}</span></div>${extra ? `<div class="sub">${extra}</div>` : ''}${chg}${askBox}${plan}${recap}</div>`;
  };
  return `<div class="sesss">${open.map(card).join('')}</div>`;
}

// main session: the change's trail step plus the step in progress of its list
function stageCell(r) {
  const p = r.main && r.plan && r.plan.current ? `${esc(r.plan.current)} <span class="sub">(${r.plan.done}/${r.plan.total})</span>` : '';
  if (r.stage && p) return `${esc(r.stage)} · ${p}`;
  return r.stage ? esc(r.stage) : p || '<span class="sub" title="could not infer it from the prompt">—</span>';
}
// the main session row says its branch; a cell's clock is filled by tick(), so the HTML is stable between updates
function agentsTable(list, live) {
  return `<div class="scroll"><table><thead><tr><th>agent</th><th>change</th><th>stage</th><th>session</th><th>since</th><th>${live ? 'last activity' : 'finished'}</th>${tokHeads}${usdHead}<th>model</th><th>what</th></tr></thead><tbody>${list.map((r) => `
    <tr><td><span class="st ${stCls(r.status)}" title="${esc(r.status)}"></span>${esc(r.agent)}${r.main ? ' <span class="sub">(main session)</span>' : ''}${silentTxt(r)}</td>
      <td>${esc(changeLabel(r.change))}</td><td>${stageCell(r)}${r.main && r.ask ? ' <span class="badge warn">question for you</span>' : ''}</td>
      <td class="sess" title="${esc(r.sessionId || '')}">${esc(r.sessionName || '—')}</td>
      <td>${fmtTime(r.since)}${live ? ` <span class="sub">(<span data-since="${r.since}"></span> ago)</span>` : ''}</td>
      <td>${live ? `${fmtTime(r.lastActivity)}` : `${fmtTime(r.end)} <span class="sub">${esc(r.status)}</span>`}</td>
      ${tokCols(r.tokenSplit)}${usdCol(r.usd)}<td>${esc(r.model || '?')}</td><td>${esc(r.description || '')}${r.main && r.gitBranch ? ` <span class="sub">· branch ${esc(r.gitBranch)}</span>` : ''}${r.tests ? ' ' + testsBadge(r.tests) : ''}</td></tr>`).join('')}</tbody></table></div>`;
}

const stCls = (st) => (st === 'no signal' || st === 'interrupted' ? 'stale' : esc(st));
const sessLine = (r) => (r && r.sessionName ? `<div class="sess" title="${esc(r.sessionId || '')}">session: ${esc(r.sessionName)}</div>` : '');
const silentTxt = (r) => (r.status === 'no signal' ? ` <span class="sub" title="no activity in the transcript and no recorded end (limit: ${state.staleMin} min)">no signal for <span data-silent="${Date.now() - (r.silentMs || 0)}"></span></span>` : '');
// "waiting for <who> for X" + note + source (declared or inferred, with the rule)
function waitHtml(w, extra = '') {
  if (!w) return '';
  const decl = w.source === 'declared';
  const since = decl && w.since ? ` <span class="sub">for <span data-since="${w.since}"></span></span>` : '';
  const note = decl && w.note ? `<span class="rule">${esc(w.note)}</span>` : '';
  const src = decl ? `<span class="src decl">declared: ${esc(w.rule)}</span>` : `<span class="src">inferred: ${esc(w.rule)}</span>`;
  return `<div class="wait${w.text === 'undefined' ? ' undef' : ''}"><b>${esc(w.text)}</b>${since}${note}<span class="rule">${src}</span>${w.warning ? `<span class="warnline">${esc(w.warning)}</span>` : ''}${extra}</div>`;
}
// stuck: why the cycle stopped and the prompt that resumes it in a /team session
function stuckHtml(c) {   // the reason, the agent's last words before it stopped, and how to resume
  const s = c.stuck;
  if (!s) return '';
  const last = (c.runs.find((r) => r.id === s.runId) || {}).summary || '';
  return `<div class="stuckbox"><b>stuck</b>: ${esc(s.agent)} ${s.kind === 'interrupted' ? 'interrupted' : 'failed'}${s.at ? ` at ${fmtTime(s.at)}` : ''}, nobody running since<span class="why">${esc(s.reason)}</span>resume in a session: <code>${esc(s.resume)}</code><button type="button" data-copy="${esc(s.resume)}">copy</button>${last ? `<details class="tfx"><summary>last words of ${esc(s.agent)}</summary><pre>${esc(last)}</pre></details>` : ''}</div>`;
}
function cardHtml(c) {
  const b = [];
  if (c.stuck) b.push(`<span class="badge bad">stuck</span>`);
  if (c.budget && c.budget.over) b.push(`<span class="badge warn" title="BUDGET_${c.budget.size.toUpperCase()}_USD in ai-team.conf">over budget: ${fmtUsd(c.usd)} of ${fmtUsd(c.budget.limit)}</span>`);
  if (c.tasks.total) b.push(`<span class="badge">tasks ${c.tasks.done}/${c.tasks.total}</span>`);
  if (c.tasks.blocked) b.push(`<span class="badge bad">${c.tasks.blocked} blocked</span>`);
  if (c.kind === 'adhoc') {   // no change: review and validation come back in the agents' replies, not in a file
    b.push(`<span class="badge">ad-hoc task</span>`);
    if (c.activeAgents.length) b.push(`<span class="badge ok">running: ${esc(c.activeAgents.map((a) => a.agent).join(', '))}</span>`);
  } else if (c.kind !== 'no-change') {
    b.push(c.review ? `<span class="badge ${/APPROVED/.test(c.review) && !/NOT APPROVED|CHANGES/.test(c.review) ? 'ok' : 'warn'}">review: ${esc(c.review)}</span>` : `<span class="badge">no review</span>`);
    b.push(c.validation ? `<span class="badge ${/APPROVED/.test(c.validation) && !/NOT APPROVED/.test(c.validation) ? 'ok' : 'bad'}">Validation: ${esc(c.validation)}</span>` : `<span class="badge">no validation</span>`);
  }
  if (c.tests) b.push(testsBadge(c.tests));
  if (c.archived) b.push(`<span class="badge ok">archived</span>`);
  if (c.unknown) b.push(`<span class="badge warn">no folder in openspec/</span>`);
  const secs = Object.entries(c.sections).filter(([, v]) => v.total).map(([k, v]) => `<div class="row"><span>${esc(k.replace(/\s*\(.*$/, ''))}</span><div class="bar"><i style="width:${Math.round(100 * v.done / v.total)}%"></i></div><span>${v.done}/${v.total}</span></div>`).join('');
  const w = c.waiting;
  const wait = stuckHtml(c) + waitHtml(w);
  const ag = c.agents.length ? `<table class="mini"><thead><tr><th>agent</th>${tokHeads}${usdHead}<th class="num">runs</th></tr></thead><tbody>${c.agents.map((a) => `<tr><td><span class="dot" style="background:${colorOf(a.agent)};width:8px;height:8px;margin-right:6px"></span>${esc(a.agent)}</td>${tokCols(a.tokenSplit)}${usdCol(a.usd)}<td class="num">${a.runs}</td></tr>`).join('')}</tbody></table>` : '';
  return `<div class="card${c.budget && c.budget.over ? ' over' : ''}" data-change="${esc(c.id)}" tabindex="0" role="button">
    <div class="top"><div class="id">${esc(c.title || c.id)}</div><div class="sub" title="start: ${esc(c.startSource || 'unknown')}">${c.startedAt ? 'started ' + fmtDate(c.startedAt) : ''}</div></div>
    <div class="badges">${b.join('')}</div>
    <div class="metrics"><span title="${TIP_NEW}"><b>${fmtTok(c.tokenSplit.fresh)}</b> fresh</span><span title="${TIP_CACHE}"><b>${fmtTok(c.tokenSplit.cached)}</b> cache read</span><span title="${TIP_USD}${c.unpricedModels && c.unpricedModels.length ? ` (no price for ${esc(c.unpricedModels.join(', '))})` : ''}"><b>${fmtUsd(c.usd)}</b>${c.budget ? ` <span class="sub">of ${fmtUsd(c.budget.limit)}</span>` : ''}</span><span><b>${c.rounds}</b> runs</span><span title="time of the agents on this change"><b>${fmtDur(c.durationMs)}</b></span>${c.handoffs ? `<span title="how many times the change moved to a different agent"><b>${c.handoffs}</b> handoffs</span>` : ''}<span>activity ${c.lastActivity ? fmtTime(c.lastActivity) : '—'}</span></div>
    ${secs ? `<div class="secs">${secs}</div>` : ''}${wait}${ag}
  </div>`;
}

function runsTable(runs, showChange) {
  if (!runs.length) return '<p class="note">no runs.</p>';
  return `<div class="scroll"><table><thead><tr><th>agent</th>${showChange ? '<th>change</th>' : ''}<th>from → to</th><th>start</th><th>end</th><th class="num">duration</th>${tokHeads}${usdHead}<th>model</th><th>what</th></tr></thead><tbody>${runs.map((r, i) => `
    <tr class="run" data-i="${i}" tabindex="0" aria-expanded="false"><td><span class="st ${stCls(r.status)}" title="${esc(r.status)}"></span>${esc(r.agent)}${r.background ? ' <span class="sub" title="background">bg</span>' : ''}${silentTxt(r)}</td>
      ${showChange ? `<td>${esc(changeLabel(r.change))}</td>` : ''}
      <td class="flow"><b>${esc(r.from || '?')}</b> → <b>${r.to ? esc(r.to) : (r.active ? '…' : '?')}</b></td>
      <td>${fmtTime(r.start)}</td><td>${r.active ? '<em>running</em>' : fmtTime(r.end)}</td>
      <td class="num" data-run-start="${r.active ? r.start : ''}">${r.active ? '' : fmtDur(liveDur(r))}</td>
      <td class="num" title="${TIP_NEW} (input ${fmtTok(r.usage.input)} · output ${fmtTok(r.usage.output)} · cache written ${fmtTok(r.usage.cacheCreation)}) · ${r.usage.requests} calls · ${r.toolUses} tools">${fmtTok(r.tokenSplit.fresh)}</td><td class="num" title="${TIP_CACHE}">${fmtTok(r.tokenSplit.cached)}</td>${usdCol(r.usd)}
      <td>${esc(r.model || '?')}</td><td>${esc(r.description || '')}${r.tests ? ' ' + testsBadge(r.tests) : ''}${sessLine(r)}</td></tr>
    <tr class="detail" hidden><td colspan="${showChange ? 10 : 9}">${esc(r.summary ? 'reply: ' + r.summary : '')}${r.summary && r.promptPreview ? '\n\n' : ''}${esc(r.promptPreview ? 'prompt: ' + r.promptPreview : '')}\n\ntokens: input ${fmtTok(r.usage.input)} · output ${fmtTok(r.usage.output)} · cache written ${fmtTok(r.usage.cacheCreation)} · cache read ${fmtTok(r.usage.cacheRead)} · ${r.usage.requests} calls · ${r.toolUses} tools${r.totalTokensReported != null ? ` · reported by the Agent tool: ${fmtTok(r.totalTokensReported)}` : ''}</td></tr>`).join('')}</tbody></table></div>`;
}


// ---- conversation: feed messages (the assembly logic is in /feed.mjs) ----
function chatHtml(items, showChange) {
  if (!items.length) return '<p class="note">no runs.</p>';
  return items.map((m) => {
    if (m.type === 'sep') return `<div class="sep${m.active ? ' on' : ''}">${esc(m.label)}${m.active ? ' · now' : ''}</div>`;
    const u = m.usage;
    const tip = `${TIP_NEW} (input ${fmtTok(u.input)} · output ${fmtTok(u.output)} · cache written ${fmtTok(u.cacheCreation)}) · ${u.requests} calls`;
    const stTag = m.status === 'failed' ? '<span class="tag bad">failed</span>' : m.status === 'no signal' ? `<span class="tag warn" title="no activity in the transcript and no recorded end">no signal for ${fmtDur(m.silentMs)}</span>` : m.status === 'interrupted' ? '<span class="tag warn">interrupted</span>' : '';
    const route = `called by <b>${esc(m.route.by)}</b>`;
    const around = m.route.around ? `<div class="around">${esc(m.route.around)}</div>` : '';
    const when = m.active ? `${fmtTime(m.start)} → <em>running</em>` : `${fmtTime(m.start)} → ${fmtTime(m.end)}`;
    const quote = m.summary ? `<div class="r">${m.summaryParts.map((p) => p.cls ? `<span class="${p.cls}">${esc(p.text)}</span>` : esc(p.text)).join('')}</div>` : '';
    const det = [m.promptPreview ? 'prompt: ' + m.promptPreview : '', m.totalTokensReported != null ? 'tokens reported by the Agent tool: ' + fmtTok(m.totalTokensReported) : ''].filter(Boolean).join('\n\n');
    return `<div class="msg${m.active ? ' on' : ''}" data-hc="${esc(m.agent)}">${avatar(m.agent, m.presence, { filter: false })}<div class="b">
      <div class="h"><b>${esc(m.agent)}</b>${m.background ? '<span class="tag" title="background">bg</span>' : ''}${stTag}${showChange ? `<span class="tag">${esc(m.change || '—')}</span>` : ''}<span class="route">${route}</span><span class="t">${when}</span></div>
      ${around}${m.sessionName ? `<div class="sess">session: ${esc(m.sessionName)}</div>` : ''}
      <div class="c">${esc(m.description || '(no description)')}${m.active ? '<span class="typing" title="working"><i></i><i></i><i></i></span>' : ''}</div>
      ${quote}
      <div class="chips"><span>${esc(m.model)}</span><span class="num"${m.active ? ` data-run-start="${m.start}"` : ''}>${m.active ? '' : fmtDur(m.durationMs)}</span><span title="${tip}"><b>${fmtTok(m.fresh)}</b> fresh</span><span title="${TIP_CACHE}"><b>${fmtTok(m.cached)}</b> cache read</span><span><b>${m.toolUses}</b> tool${m.toolUses === 1 ? '' : 's'}</span>${m.tests ? testsBadge(m.tests, 'tag') : ''}</div>${m.tests && m.tests.ok === false ? `<details class="tfx"><summary>what failed</summary>${testFailHtml(m.tests, { head: false })}</details>` : ''}
      ${det ? `<details><summary>show prompt</summary><pre>${esc(det)}</pre></details>` : ''}</div></div>`;
  }).join('');
}

// ---- presence card (hover over an avatar or a message) ----
const hc = $('#hc');
function hcHtml(name) {
  const c = drawer && drawer.kind === 'change' ? state.changes.find((x) => x.id === drawer.id) : null;
  if (!c) return '';
  const main = state.project.mainAgent;
  const d = cardData(c, name, { mainAgent: main, mainLive: state.mainRuns.some((r) => r.agent === main && r.active && r.live) });
  const col = { on: 'var(--ok)', wait: 'var(--warn)', stale: 'var(--amber)', failed: 'var(--bad)' }[d.presence] || 'var(--muted)';
  let st = d.presence === 'on' ? `● working${d.since ? ` for <span data-since="${d.since}">${fmtDur(Date.now() - d.since)}</span>` : ''}` : d.presence === 'wait' ? 'queued' : d.presence === 'stale' ? 'no signal or interrupted' : d.presence === 'failed' ? 'failed' : (d.endAt ? `finished at ${fmtTime(d.endAt)}` : 'no runs in this change');
  if (d.verdictText) st += ` · <span class="${d.verdict === 'ok' ? 'vok' : 'vbad'}">${esc(d.verdictText)}</span>`;
  const cut = (t) => esc(t.length > 220 ? t.slice(0, 220) + '…' : t);
  const trunc = d.isMain ? '—' : null;
  return `<div class="top">${avatar(name, d.presence, { large: true, filter: false }).replace(/ data-hc="[^"]*"/, '')}<div><div class="nm">${esc(name)}</div><div class="role">${esc(d.role)}${d.model ? ' · ' + esc(d.model) : ''}</div><div class="stt" style="color:${col}">${st}</div></div></div>
    ${d.route ? `<div class="row"><div class="k">called by</div><div class="q">${esc(d.route.by)}${d.route.around ? `<br><span class="sub">${esc(d.route.around)}</span>` : ''}</div></div>` : ''}
    ${d.what ? `<div class="row"><div class="k">what</div><div class="q">${cut(d.what)}</div></div>` : ''}
    ${d.lastReturn ? `<div class="row"><div class="k">last reply</div><div class="q">${cut(d.lastReturn)}</div></div>` : ''}
    <div class="kv"><div><span class="k">${d.isMain ? 'delegations' : 'runs'}</span><b>${d.rounds}</b></div><div><span class="k">fresh</span><b>${trunc || fmtTok(d.fresh)}</b></div><div><span class="k">cache read</span><b>${trunc || fmtTok(d.cached)}</b></div></div>`;
}
function hideHc() { hc.style.display = 'none'; hc.dataset.for = ''; }
// shown on hover and on keyboard focus (avatars are focusable)
function showHc(e) {
  const el = e.target.closest ? e.target.closest('[data-hc]') : null;
  if (!el || !drawer || drawer.kind !== 'change') return hideHc();
  const key = el.dataset.hc;
  if (hc.dataset.for !== key || hc.style.display === 'none') {
    const html = hcHtml(key); if (!html) return hideHc();
    hc.innerHTML = html; hc.dataset.for = key;
  }
  hc.style.display = 'block';

// ---- time of a change (sub-tab Time): by stage, what the minutes went to inside each, and by task

// deep link: #change=<id> / #agent=<name> opens that drawer (on load, after the first state, and on hashchange)

}

$('#dlink').addEventListener('click', (e) => { if (drawer) copyText(location.href.split('#')[0] + hashFor(drawer.kind, drawer.id), e.currentTarget); });

// click, Enter or Space on a change card, an agent tile, a run row, an avatar (filter) or "show all"
function activate(e) {

  if (t.closest('button[data-seen]')) { e.preventDefault(); e.stopPropagation(); try { localStorage.setItem(seenKey(), String(Date.now())); } catch {} lastMainHtml = ''; render(); return; }

  const ct = t.closest('[data-compact]');

  const vg = t.closest('[data-view-go]');
  if (vg && drawer && e.type === 'click') { e.preventDefault(); drawer.view = vg.dataset.viewGo; drawer.file = null; pinTab(drawer); saveTabs(); return rerender(); }
  const tk = t.closest('[data-task]');
  if (tk && drawer && e.type === 'click') { e.preventDefault(); drawer.taskSel = drawer.taskSel === tk.dataset.task ? null : tk.dataset.task; pinTab(drawer); return rerender(); }

// ---- pending decisions (ask.mjs): redraws only when the list changes, so typed text is not lost
let decKey = '';
const sessName = (id) => { const r = state && (state.mainRuns || []).find((x) => x.sessionId === id); return r ? r.sessionName : id ? id.slice(0, 8) : '?'; };
function decisionHtml(p) {

  // another action are type=button so the form's Enter never fires them
  if (p.kind === 'reply') {   // end of turn in away mode: the answer goes back to the session as your message
    const q = p.questions[0];
    return `<form class="dec" data-dec="${esc(p.id)}" tabindex="-1">${head}${p.summary ? `<details><summary class="sub">last reply of the session</summary><div class="ctx">${esc(p.summary)}</div></details>` : ''}
      <div class="q" id="q-${esc(p.id)}">${esc(q.question)}</div><div class="opts">${q.options.map((o, i) => `<button type="button" data-act="opt" data-i="${i}" title="${esc(o.description || o.label)}">${esc(o.label)}</button>`).join('')}</div>
      <textarea name="reply" aria-labelledby="q-${esc(p.id)}" placeholder="or write the answer (Ctrl+Enter sends)"></textarea>
      <div class="acts"><button type="submit" class="pri" data-act="reply">Send answer</button><button type="button" data-act="app">Leave it to the app</button><span class="msg" aria-live="polite"></span></div></form>`;
  }

      <label class="o"><input type="${q.multiSelect ? 'checkbox' : 'radio'}" name="q${i}" value="__other"><span>Other</span></label><input type="text" name="t${i}" aria-label="free answer to: ${esc(q.question)}" placeholder="free answer (selects Other)">`).join('');
    return `<form class="dec" data-dec="${esc(p.id)}" tabindex="-1">${head}${qs}<div class="acts"><button type="submit" class="pri" data-act="send">Send answer</button><button type="button" data-act="skip">Decline</button><span class="msg" aria-live="polite"></span></div></form>`;
  }
  return `<form class="dec" data-dec="${esc(p.id)}" tabindex="-1">${head}<div class="cmd">${esc(p.summary)}</div>${p.detail ? `<div class="sub">${esc(p.detail)}</div>` : ''}
    <div class="acts"><button type="submit" class="pri" data-act="allow">Allow once <span class="kbd">A</span></button><button type="button" data-act="deny">Deny <span class="kbd">D</span></button><input type="text" name="why" aria-label="reason for denying" placeholder="reason (optional, goes to Claude)" style="flex:1;min-width:180px"><span class="msg" aria-live="polite"></span></div></form>`;
}
function renderDecisions() {
  const list = (state && state.pending) || [];

  const box = $('#decisions');
  const badge = $('#decbadge'); badge.hidden = !list.length; badge.textContent = list.length;

  box.hidden = !list.length;

  if (!$('#declist', box)) box.innerHTML = `<h2>Decisions waiting for you<span class="n"></span></h2><p class="note">Answer here or in the app: the first answer wins. With no answer, the hook gives up after a few minutes and only the app asks.</p><div id="declist"></div>`;
  renderProblems();

  const wrap = $('#declist', box), ids = new Set(list.map((p) => p.id));

$('#decisions').addEventListener('input', (e) => {   // typing in "Other" selects the option

async function decide(b) {

// away mode
function renderAway() {

// the SSE notice, the fallback poll and the first load all fetch: only the newest response is applied
let fetchSeq = 0;
async function refresh() {
  const my = ++fetchSeq;
  try {
    const r = await fetch('api/state', { cache: 'no-store' });
    if (r.status === 401) { location.href = `/login?next=${encodeURIComponent(location.pathname)}`; return; }   // outside session expired
    const next = await r.json();
    if (my !== fetchSeq || (state && next.generatedAt && state.generatedAt && next.generatedAt < state.generatedAt)) return;   // an older answer that arrived late

// clocks: elapsed since (data-since), running for (data-run-start), silent for (data-silent); filled right
// after each render too, so the HTML of the page does not change with the clock
function tick() {
  const now = Date.now();
  document.querySelectorAll('[data-since]').forEach((el) => { el.textContent = fmtDur(now - Number(el.dataset.since)); });
  document.querySelectorAll('[data-run-start]').forEach((el) => { if (el.dataset.runStart) el.textContent = fmtDur(now - Number(el.dataset.runStart)); });
  document.querySelectorAll('[data-silent]').forEach((el) => { el.textContent = fmtDur(now - Number(el.dataset.silent)); });

// ---- command palette ----
const mac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);

const SHORTCUTS = [[[mac ? '⌘K' : 'Ctrl K'], 'command palette: changes, agents, actions, theme'], [['J'], 'next card, row or decision'], [['K'], 'previous card, row or decision'],
  [['↵'], 'open the focused change or agent'], [['A'], 'allow the focused permission'], [['D'], 'deny the focused permission (with the typed reason)'],
  [['/'], 'filter the changes and agents in the explorer'], [['↑', '↓'], 'move in the explorer (← → fold a group)'], [[mac ? '⌘B' : 'Ctrl B'], 'show or hide the explorer'],
  [['ctrl `'], 'show or hide the panel (Problems, Events, Output)'], [['alt 1'], 'Overview'], [['alt 2…8'], 'open tab 1…7 (alt 9: the last one)'], [['alt W'], 'close the open tab'],
  [['esc'], 'back to Overview, close the palette or clear the filter'], [['?'], 'this list']];

  if (!state || state.error) return baseCommands();

// ---- keyboard: J/K move between decisions, change rows/cards and agent tiles; A/D act on the focused permission ----
const navItems = () => [...document.querySelectorAll('#decisions .dec, #main [data-change].crow, #main .card[data-change], #main .tile[data-agent]')].filter((el) => el.offsetParent !== null);
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'b' && !palette.isOpen()) { e.preventDefault(); toggleSide(); return; }
  if (e.ctrlKey && !e.metaKey && !e.altKey && e.code === 'Backquote' && !palette.isOpen()) { e.preventDefault(); showPanel(layout.panelTab, !layout.panel); return; }
  // tabs: Alt+1 Overview, Alt+2…8 the tabs, Alt+9 the last, Alt+W closes (⌘1…9 and ⌘W belong to the browser)
  if (e.altKey && !e.metaKey && !e.ctrlKey && !typing(e) && !palette.isOpen()) {

  if (dec && (e.key === 'a' || e.key === 'd')) {
    const b = dec.querySelector(`button[data-act="${e.key === 'a' ? 'allow' : 'deny'}"]`);
    if (b && !b.disabled) { e.preventDefault(); decide(b); }
  }
});

applyMobile(); openInboxHash();
