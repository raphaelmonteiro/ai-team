<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-team · notifications</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1c1f24; --muted: #6b7280; --line: #e5e7eb; --accent: #2563eb;
    --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --chip: #eef2ff; --soft: #f1f3f7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #171a21; --ink: #e5e7eb; --muted: #9ca3af; --line: #262b36; --accent: #60a5fa; --chip: #1f2637; --soft: #1b1f28; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 18px; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; }
  nav.tabs { display: flex; gap: 4px; margin-left: auto; }
  nav.tabs a { color: var(--muted); text-decoration: none; padding: 3px 12px; border-radius: 6px; font-size: 13px; }
  nav.tabs a.cur { background: var(--chip); color: var(--ink); font-weight: 600; }
  main { padding: 16px 20px 80px; max-width: 760px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 4px 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 14px; }
  .sub { color: var(--muted); font-size: 12.5px; }
  label.f { display: block; margin-top: 12px; font-weight: 600; font-size: 13px; }
  label.f .sub { font-weight: 400; display: block; }
  input[type=text], input[type=password], input[type=url] { width: 100%; margin-top: 4px; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  .checks label { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; cursor: pointer; font-weight: 400; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  button { font: inherit; padding: 6px 16px; border-radius: 7px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); cursor: pointer; }
  button.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  .msg { font-size: 13px; } .msg.ok { color: var(--ok); } .msg.err { color: var(--bad); }
  code { background: var(--soft); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; word-break: break-all; }
  .warn { background: rgba(217,119,6,.12); border: 1px solid var(--warn); border-radius: 8px; padding: 8px 12px; margin-top: 12px; font-size: 13px; }
  .proj[hidden] { display: none; }
</style>
</head>
<body>
<header>
  <h1>Notifications</h1>
  <span class="meta" id="meta"></span>
  <nav class="tabs"><a href="./">Dashboard</a><a href="team">Team</a><a href="notifications" class="cur">Notifications</a></nav>
</header>
<main>
  <div class="card">
    <h2>On this computer</h2>
    <p class="sub">Applies to every project on this PC. The notices go out through each project's hooks (<code>.claude/settings.json</code>, kept by the installer). File: <code id="file"></code></p>
    <div id="envoff" class="warn" hidden><code>AI_TEAM_NOTIFY=0</code> is set in the dashboard environment: nothing is sent.</div>
    <label class="f">Topic <span class="sub">the name you subscribe to in the ntfy phone app; anyone who knows the topic reads the messages on public ntfy.sh</span>
      <input type="text" id="topic" autocomplete="off" spellcheck="false" placeholder="ai-team-…"></label>
    <div class="row" style="margin-top:6px"><button type="button" id="gen">Generate random topic</button></div>
    <label class="f">Server <span class="sub">https://ntfy.sh or your own server</span>
      <input type="url" id="server" spellcheck="false"></label>
    <label class="f">Access token <span class="sub" id="tokhint">only if the server (or the reserved topic) requires it</span>
      <input type="password" id="token" autocomplete="new-password" placeholder=""></label>
    <div class="checks" id="tokclear" hidden><label><input type="checkbox" id="clearToken"> delete the saved token</label></div>
    <label class="f">Notify when</label>
    <div class="checks" id="on"></div>
    <label class="f">Content</label>
    <div class="checks"><label><input type="checkbox" id="detail"> <span>Send the content <span class="sub">the requested command, the question options and the start of the agent text; off, only the title goes</span></span></label></div>
    <label class="f">Dashboard address <span class="sub">opened when tapping the notification (e.g. the Tailscale address); empty, the notification opens nothing</span>
      <input type="url" id="dashboardUrl" spellcheck="false" placeholder="https://…"></label>
  </div>
  <div class="card">
    <h2>Only in this project</h2>
    <p class="sub" id="projdir"></p>
    <div class="checks"><label><input type="checkbox" id="override"> <span>Use other events in this project</span></label></div>
    <div class="checks proj" id="projOn" hidden></div>
  </div>
  <div class="row">
    <button class="pri" id="save">Save</button>
    <button id="test">Send test</button>
    <span class="msg" id="msg"></span>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const LABEL = { decision: ['Decision waiting for you', 'permission or question, the same as in the dashboard'], agent_stop: ['Agent finished', 'each team subagent that ends'], turn_stop: ['Session waiting for you', 'the main session finished its turn'], turn_failed: ['Turn stopped on error', 'usage limit, API overloaded, login failure etc.'], session_end: ['Session ended', '/clear, /resume, logout or the session closed (interrupting with Esc does not notify: there is no hook)'] };
let view = null;
const boxes = (el, name, sel) => { el.innerHTML = view.events.map((e) => `<label><input type="checkbox" name="${name}" value="${e}"${sel.includes(e) ? ' checked' : ''}> <span>${LABEL[e][0]} <span class="sub">${LABEL[e][1]}</span></span></label>`).join(''); };
const picked = (name) => [...document.querySelectorAll(`input[name=${name}]:checked`)].map((x) => x.value);
const say = (t, cls = '') => { $('#msg').textContent = t; $('#msg').className = `msg ${cls}`; };
function fill(v) {
  view = v;
  $('#file').textContent = v.file; $('#envoff').hidden = !v.disabledByEnv;
  $('#topic').value = v.topic; $('#server').value = v.server; $('#detail').checked = v.detail; $('#dashboardUrl').value = v.dashboardUrl;
  $('#token').value = ''; $('#token').placeholder = v.hasToken ? 'saved (leave empty to keep)' : ''; $('#tokclear').hidden = !v.hasToken; $('#clearToken').checked = false;
  boxes($('#on'), 'on', v.on);
  $('#projdir').textContent = v.project.dir;
  $('#override').checked = !!v.project.on; $('#projOn').hidden = !v.project.on;
  boxes($('#projOn'), 'projOn', v.project.on || v.on);
  $('#meta').textContent = v.configured ? `topic ${v.topic}` : 'not configured yet';
}
$('#override').addEventListener('change', () => { $('#projOn').hidden = !$('#override').checked; });
$('#gen').addEventListener('click', () => {
  const a = new Uint8Array(9); crypto.getRandomValues(a);
  $('#topic').value = 'ai-team-' + [...a].map((b) => (b % 36).toString(36)).join('');
});
async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const o = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(o.error || r.status);
  return o;
}
$('#save').addEventListener('click', async () => {
  say('saving…');
  try {
    const o = await post('api/notify', { topic: $('#topic').value, server: $('#server').value, token: $('#token').value, clearToken: $('#clearToken').checked,
      on: picked('on'), detail: $('#detail').checked, dashboardUrl: $('#dashboardUrl').value, projectOn: $('#override').checked ? picked('projOn') : null });
    fill(o.view); say('saved', 'ok');
  } catch (e) { say(`not saved: ${e.message}`, 'err'); }
});
$('#test').addEventListener('click', async () => {
  say('sending…');
  try { await post('api/notify/test', {}); say('sent: check your phone', 'ok'); } catch (e) { say(e.message, 'err'); }
});
(async () => {
  const r = await fetch('api/notify', { cache: 'no-store' });
  if (r.status === 401) { location.href = `/login?next=${encodeURIComponent(location.pathname)}`; return; }
  fill(await r.json());
})();
</script>
</body>
</html>
