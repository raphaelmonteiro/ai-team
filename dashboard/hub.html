<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  header { gap: 8px 20px; align-items: center; padding: 10px 20px; position: static; }
  header h1 { font-size: 14px; white-space: nowrap; }
  header h1 a { color: inherit; text-decoration: none; }
  nav { display: flex; gap: 4px; overflow-x: auto; max-width: 100%; }
  nav a { color: var(--muted); text-decoration: none; padding: 4px 12px; border-radius: 4px; font-size: 13px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  nav a:hover { color: var(--ink); }
  nav a.cur { background: var(--soft); color: var(--ink2); font-weight: 500; }
  #teams { margin-left: auto; }
  /* the open team's projects sit in the header, right after the brand: one bar, not two */
  #projects { padding-left: 14px; border-left: 1px solid var(--line); }
  #projects:empty { display: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: inline-block; flex: none; }
  .dot.on { background: var(--ok); }
  main { flex: 1; padding: 16px 20px 60px; max-width: 1400px; width: 100%; margin: 0 auto; }
  main.frame { padding: 0; max-width: none; display: flex; }
  iframe { border: 0; width: 100%; flex: 1; background: var(--bg); }
  h2 { display: flex; gap: 8px; align-items: baseline; }
  h2 a { color: inherit; text-decoration: none; } h2 a:hover { color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .card { --dvf: var(--card); display: block; background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; color: inherit; text-decoration: none; transition: border-color .15s; min-width: 0; }
  .card:hover { border-color: var(--line2); }
  .card .top { display: flex; align-items: center; gap: 8px; font: 500 14px var(--mono); color: var(--ink2); }
  .card .dir { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .card .row { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .card .row b { color: var(--ink); font-weight: 600; }
  .card .cost { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .card .cost b { color: var(--ink); font: 600 15px var(--mono); } .card .cost span { white-space: nowrap; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .note { color: var(--muted); font-size: 12px; }
  .warnline { color: var(--warn); font-size: 12px; margin: 4px 0; }
  .stalebar { color: var(--warn); font-size: 12px; padding: 6px 20px; background: var(--warnbg); border-bottom: 1px solid var(--line); }
  .stalebar[hidden] { display: none; }
  @media (max-width: 640px) { .stalebar { padding-left: 16px; padding-right: 16px; } #teams { margin-left: 0; } #projects { border-left: 0; padding-left: 0; } }
  /* a project open on a phone: one compact header row (brand and the team's projects; All goes back), the page has its own top bar */
  @media (max-width: 760px) { body.framed header { padding: 6px 12px; flex-wrap: nowrap; } body.framed #teams, body.framed header h1 .slash, body.framed header h1 .proj { display: none; } body.framed #projects { overflow-x: auto; } }
</style>

 1.011)'><g transform='translate(1.7 -17) rotate(.5)'><use href='#dv-h'/><path d='M2.7 -2.5q1.3 -1 2.7 -.2' stroke-width='.8'/></g><path d='M.7 -7.4L1.4 -3.8L4.8 -3.7' stroke-width='3.4'/><path style='stroke:var(--dvf)' d='M.7 -7.4L1.4 -3.8L4.8 -3.7' stroke-width='1.8'/><circle style='fill:var(--dvf)' cx='4.8' cy='-3.7' r='1.45' stroke-width='.8'/><g transform='translate(4.8 -3.7) rotate(-4.6)'><use href='#dv-m'/><path d='M1.2 -3.9q-.3 -.8 -.4 -1.6t-.4 -1.3M2.5 -4q-.8 -.7 -.3 -1.4t-.3 -1' stroke-width='.6' opacity='.75'/></g></g></g><g transform='translate(704)'><g opacity='.55'><path d='M14.4 29.4L15.1 33.8L12.4 37.2' stroke-width='3.6'/><path style='stroke:var(--dvf)' d='M14.4 29.4L15.1 33.8L12.4 37.2' stroke-width='2'/><use href='#dv-s' transform='translate(12.4 37.2) rotate(5.7)'/></g><g transform='translate(14.4 29.4) rotate(5.2) scale(1 .9956)'><g opacity='.55'><path d='M.7 -7.4L2.5 -4.2L5.7 -3' stroke-width='3.4'/><path style='stroke:var(--dvf)' d='M.7 -7.4L2.5 -4.2L5.7 -3' stroke-width='1.8'/><circle style='fill:var(--dvf)' cx='5.7' cy='-3' r='1.45' stroke-width='.8'/></g><use href='#dv-t'/></g><path d='M14.4 29.4L18 32.1L18.2 36.4' stroke-width='3.6'/><path style='stroke:var(--dvf)' d='M14.4 29.4L18 32.1L18.2 36.4' stroke-width='2'/><use href='#dv-s' transform='translate(18.2 36.4) rotate(-7.1)'/><g transform='translate(14.4 29.4) rotate(5.2) scale(1 .9956)'><g transform='translate(1.7 -17.1) rotate(1.6)'><use href='#dv-h'/><path d='M2.7 -2.3q1.3 -1 2.7 -.2' stroke-width='.8'/></g><path d='M.7 -7.4L1.4 -3.8L4.8 -3.6' stroke-width='3.4'/><path style='stroke:var(--dvf)' d='M.7 -7.4L1.4 -3.8L4.8 -3.6' stroke-width='1.8'/><circle style='fill:var(--dvf)' cx='4.8' cy='-3.6' r='1.45' stroke-width='.8'/><g transform='translate(4.8 -3.6) rotate(-5.2)'><use href='#dv-m'/><path d='M1.2 -3.9q-.4 -.8 -.4 -1.6t-.4 -1.3M2.5 -4q-.8 -.7 -.3 -1.4t-.3 -1' stroke-width='.6' opacity='.75'/></g></g></g><g transform='translate(736)'><g opacity='.55'><path d='M14.4 29.7L14.9 34.1L11.9 37.2' stroke-width='3.6'/><path style='stroke:var(--dvf)' d='M14.4 29.7L14.9 34.1L11.9 37.2' stroke-width='2'/><use href='#dv-s' transform='translate(11.9 37.2) rotate(11.8)'/></g><g transform='translate(14.4 29.7) rotate(5.7) scale(1 .9813999999999999)'><g opacity='.55'><path d='M.7 -7.4L2.7 -4.3L6 -3.4' stroke-width='3.4'/><path style='stroke:var(--dvf)' d='M.7 -7.4L2.7 -4.3L6 -3.4' stroke-width='1.8'/><circle style='fill:var(--dvf)' cx='6' cy='-3.4' r='1.45' stroke-width='.8'/></g><use href='#dv-t'/></g><path d='M14.4 29.7L17.6 32.8L18.6 37' stroke-width='3.6'/><path style='stroke:var(--dvf)' d='M14.4 29.7L17.6 32.8L18.6 37' stroke-width='2'/><use href='#dv-s' transform='translate(18.6 37) rotate(-9.2)'/><g transform='translate(14.4 29.7) rotate(5.7) scale(1 .9813999999999999)'><g transform='translate(1.7 -17.3) rotate(2.4)'><use href='#dv-h'/><path d='M2.7 -2.2q1.3 -1 2.7 -.2' stroke-width='.8'/></g><path d='M.7 -7.4L1.4 -3.8L4.7 -3.6' stroke-width='3.4'/><path style='stroke:var(--dvf)' d='M.7 -7.4L1.4 -3.8L4.7 -3.6' stroke-width='1.8'/><circle style='fill:var(--dvf)' cx='4.7' cy='-3.6' r='1.45' stroke-width='.8'/><g transform='translate(4.7 -3.6) rotate(-5.7)'><use href='#dv-m'/><path d='M1.2 -3.9q-.5 -.8 -.4 -1.6t-.4 -1.3M2.5 -4q-.6 -.7 -.3 -1.4t-.3 -1' stroke-width='.6' opacity='.75'/></g></g></g><g transform='translate(768)'><g opacity='.55'><path d='M14.4 28.6L15 33L14 37.2' stroke-width='3.6'/><path style='stroke:var(--dvf)' d='M14.4 28.6L15 33L14 37.2' stroke-width='2'/><use href='#dv-s' transform='translate(14 37.2) rotate(0)'/></g><g transform='translate(14.4 28.6) rotate(2) scale(1 1)'><g opacity='.55'><path d='M.7 -7.4L1.1 -3.7L3.1 -1' stroke-width='3.4'/><path style='stroke:var(--dvf)' d='M.7 -7.4L1.1 -3.7L3.1 -1' stroke-width='1.8'/><circle style='fill:var(--dvf)' cx='3.1' cy='-1' r='1.45' stroke-width='.8'/></g><use href='#dv-t'/></g><path d='M14.4 28.6L15.5 32.9L15.2 37.2' stroke-width='3.6'/><path style='stroke:var(--dvf)' d='M14.4 28.6L15.5 32.9L15.2 37.2' stroke-width='2'/><use href='#dv-s' transform='translate(15.2 37.2) rotate(0)'/><g transform='translate(14.4 28.6) rotate(2) scale(1 1)'><g transform='translate(1.7 -17.4) rotate(0)'><use href='#dv-h'/><path d='M2.7 -2q1.3 -1 2.7 -.2' stroke-width='.8'/></g><path d='M.7 -7.4L1.7 -3.8L5.1 -3.7' stroke-width='3.4'/><path style='stroke:var(--dvf)' d='M.7 -7.4L1.7 -3.8L5.1 -3.7' stroke-width='1.8'/><circle style='fill:var(--dvf)' cx='5.1' cy='-3.7' r='1.45' stroke-width='.8'/><g transform='translate(5.1 -3.7) rotate(-2)'><use href='#dv-m'/><path d='M1.2 -3.9q-.7 -.8 -.4 -1.6t-.4 -1.3M2.5 -4q-.5 -.7 -.3 -1.4t-.3 -1' stroke-width='.6' opacity='.75'/></g></g></g></symbol></svg>
<header>
  <h1><a href="/" data-nav style="display:flex;align-items:center;gap:10px"><span class="logo" aria-hidden="true">&gt;_</span><span>ai-team</span><span class="slash">/</span><span class="proj">hub</span></a></h1>
  <nav id="projects" aria-label="Projects of this team"></nav>
  <span class="meta" id="meta"></span>
  <nav id="teams" aria-label="Teams"></nav>
  <button id="palbtn" class="btn" type="button" style="color:var(--muted)">Commands <span class="kbd">⌘K</span></button>
</header>
<div class="stalebar" id="stale" hidden></div>
<div class="stalebar" id="restart" hidden>The dashboard's code changed on disk after the hub started (a merge or a reinstall): restart it, Ctrl+C and <code>node dashboard/server.mjs --hub</code>.</div>
<main id="main"><div class="empty">loading…</div></main>
<script type="module">
import { esc, ago, fmtClock, getJson, mountPalette, baseCommands, barsSvg, fmtUsd, followTheme, walkerHtml } from '/ui.mjs';
const $ = (s) => document.querySelector(s);
let hub = null, frameFor = null, hubAt = 0;
// with a project open, ⌘K belongs to its page (the full palette): the hub hands the key to the frame
const palette = mountPalette(() => baseCommands({ Hub: '/' }), { ownsKey: () => !frameFor });
const frameWin = () => { const f = $('#main iframe'); return f && f.contentWindow; };
document.addEventListener('keydown', (e) => {
  if (!frameFor || !(e.metaKey || e.ctrlKey) || e.altKey || e.key.toLowerCase() !== 'k') return;
  const w = frameWin(); if (!w) return;
  e.preventDefault(); $('#main iframe').focus(); w.postMessage('ai-team:palette', location.origin);
});
// the project page tells which tab it has open: the address bar follows, so a reload or a copied link reopens it
addEventListener('message', (e) => {
  if (e.origin !== location.origin || !e.data || e.data.type !== 'ai-team:hash' || !frameFor) return;
  const h = /^#[a-z]+(=[^\s]*)?$/i.test(e.data.hash || '') ? e.data.hash : '';
  if (location.hash !== h) history.replaceState(null, '', location.pathname + h);
});
followTheme();
// the hub's code on disk is newer than the running server: say so (with a project open, its status bar says it)
let codeStale = false;
async function checkCode() {
  try { const r = await fetch('/api/health', { cache: 'no-store' }); if (r.ok) { codeStale = !!(await r.json()).codeChanged; showRestart(); } } catch { /* offline: the stale bar says it */ }
}
function showRestart() { const b = $('#restart'); b.hidden = !codeStale || !!frameFor; }
setInterval(checkCode, 60e3); setTimeout(checkCode, 2000);
$('#palbtn').addEventListener('click', () => palette.open());

function route() {
  const m = /^\/t\/([a-z0-9-]+)(?:\/([a-z0-9-]+))?\/?$/.exec(location.pathname);
  return m ? { team: m[1], project: m[2] || null } : { team: null, project: null };
}
const teamUrl = (t) => `/t/${t.id}`;
const projUrl = (t, p) => `/t/${t.id}/${p.id}`;

// cost per day, last 7 days (the server fills it in the background; absent until then)
const DAY = new Intl.DateTimeFormat(undefined, { weekday: 'short', day: 'numeric' });
function costRow(p) {
  const d = p.activity; if (!d || !d.usd) return '';
  const week = d.usd.reduce((a, x) => a + x, 0), today = d.usd[d.usd.length - 1];
  const tips = d.usd.map((v, i) => `${DAY.format(new Date(d.from + i * 86400e3 + 12 * 3600e3))} · ${fmtUsd(v)}`);
  return `<div class="cost"><div><b>${fmtUsd(week)}</b> <span>last 7 days · today ${fmtUsd(today)}</span></div>${barsSvg(d.usd, { w: 112, h: 30, hotLast: p.active, tips, label: `${p.name}: cost per day, last 7 days` })}</div>`;
}
function card(t, p) {
  const b = [];
  if (!p.exists) b.push('<span class="badge bad">folder not found</span>');
  else {
    if (p.active) b.push('<span class="badge ok">active now</span>');
    if (p.viewers) b.push(`<span class="badge">open in ${p.viewers} tab${p.viewers === 1 ? '' : 's'}</span>`);
    if (!p.openspec) b.push('<span class="badge warn">no .ai-team/openspec/</span>');
    if (!p.agents) b.push('<span class="badge warn">no agents</span>');
  }
  return `<a class="card" href="${projUrl(t, p)}" data-nav>
    <div class="top">${walkerHtml(!!p.active)}${esc(p.name)}</div>
    <div class="dir" title="${esc(p.dir)}">${esc(p.dir)}</div>
    <div class="row"><span><b>${p.changes.open}</b> open change${p.changes.open === 1 ? '' : 's'}</span><span><b>${p.changes.archived}</b> archived</span><span><b>${p.agents}</b> agents</span></div>
    <div class="row"><span>last activity: <b>${esc(ago(p.lastActivity))}</b></span></div>
    ${costRow(p)}
    ${b.length ? `<div class="badges">${b.join('')}</div>` : ''}</a>`;
}
function teamSection(t, link) {
  const on = t.projects.filter((p) => p.active).length;
  const title = link ? `<a href="${teamUrl(t)}" data-nav>${esc(t.name)}</a>` : esc(t.name);
  return `<h2>${title}<span class="meta">${t.projects.length} project${t.projects.length === 1 ? '' : 's'}${on ? ` · ${on} active` : ''}</span></h2>
    ${t.projects.length ? `<div class="cards">${t.projects.map((p) => card(t, p)).join('')}</div>` : '<div class="empty">no project in this team</div>'}`;
}

function render() {
  if (!hub) return;
  const r = route();
  const team = r.team && hub.teams.find((t) => t.id === r.team);
  const proj = team && r.project && team.projects.find((p) => p.id === r.project);
  const nProj = hub.teams.reduce((n, t) => n + t.projects.length, 0);
  $('#meta').textContent = `${hub.teams.length} team${hub.teams.length === 1 ? '' : 's'} · ${nProj} project${nProj === 1 ? '' : 's'}`;
  $('#teams').innerHTML = `<a href="/" data-nav class="${r.team ? '' : 'cur'}">Overview</a>` + hub.teams.map((t) =>
    `<a href="${teamUrl(t)}" data-nav class="${t.id === r.team ? 'cur' : ''}"><span class="dot${t.projects.some((p) => p.active) ? ' on' : ''}"></span>${esc(t.name)}</a>`).join('');
  $('#projects').innerHTML = team ? `<a href="${teamUrl(team)}" data-nav class="${proj ? '' : 'cur'}">All</a>` + team.projects.map((p) =>
    `<a href="${projUrl(team, p)}" data-nav class="${proj && p.id === proj.id ? 'cur' : ''}"><span class="dot${p.active ? ' on' : ''}"></span>${esc(p.name)}</a>`).join('') : '';
  const main = $('#main');
  if (proj) {   // only the open project is real time: the iframe is the only SSE client
    document.title = `ai-team · ${proj.name}`;
    $('#palbtn').hidden = true; $('#meta').hidden = true;   // the project bar inside the frame has its own
    if (frameFor !== proj.id) {   // opens on the tab the address names (#change=…), as a reload or a shared link asks
      const h = /^#[a-z]+(=[^\s]*)?$/i.test(location.hash) ? location.hash : '';
      main.className = 'frame'; main.innerHTML = `<iframe src="/p/${proj.id}/${esc(h)}" title="${esc(proj.name)}"></iframe>`; frameFor = proj.id;
    }
    document.body.classList.add('framed'); showRestart();
    return;
  }
  frameFor = null; main.className = ''; $('#palbtn').hidden = false; $('#meta').hidden = false; document.body.classList.remove('framed'); showRestart();
  document.title = team ? `ai-team · ${team.name}` : 'ai-team · hub';
  const head = (hub.error ? `<p class="warnline">registry error: ${esc(hub.error)}</p>` : '') + hub.warnings.map((w) => `<p class="warnline">${esc(w)}</p>`).join('');
  if (r.team && !team) { main.innerHTML = head + `<div class="empty">team not found: ${esc(r.team)}</div>`; return; }
  if (r.project && !proj) { main.innerHTML = head + `<div class="empty">project not found in ${esc(team.name)}: ${esc(r.project)}</div>`; return; }
  if (!hub.teams.length) {
    main.innerHTML = head + `<div class="empty">no project registered in <code>${esc(hub.hubFile)}</code><br><br>
      register with <code>./install.sh --hub-team &lt;team&gt; ~/path/to/project</code><br>or <code>node dashboard/hub.mjs add ~/path/to/project --team &lt;team&gt;</code></div>`;
    return;
  }
  main.innerHTML = head + (team ? teamSection(team, false) : hub.teams.map((t) => teamSection(t, true)).join(''))
    + `<p class="note">Summary without real time (refreshes every 30 s). Open a project to follow the agents live. Registry: <code>${esc(hub.hubFile)}</code></p>`;
}

// a failed poll keeps the cards but says so: dimmed, with the time of the data on screen (401 goes to /login)
async function refresh() {
  try {
    hub = await getJson('/api/hub'); hubAt = Date.now(); render();
    $('#stale').hidden = true; $('#main').classList.remove('stale');
  } catch (e) {
    if (e.message === 'login required') return;
    $('#stale').hidden = false;
    $('#stale').textContent = hub ? `no connection to the server: showing data from ${fmtClock(hubAt)}` : 'no connection to the server';
    if (hub) $('#main').classList.add('stale'); else $('#main').innerHTML = '<div class="empty">no connection to the server</div>';
  }
}
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-nav]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
  e.preventDefault();
  if (a.getAttribute('href') !== location.pathname || location.hash) history.pushState(null, '', a.getAttribute('href'));
  render();
});
addEventListener('popstate', render);
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
