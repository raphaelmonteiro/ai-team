<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 866 284" width="866" height="284" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-labelledby="t">
<title id="t">How a request flows: you ask, the spec-writer plans, you approve, the builder and the integrator build, the reviewer reviews, the validator validates, and the change is merged. Review and validation send fixes back to the build.</title>
